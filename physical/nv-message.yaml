# nv::message TLV grammar — profile-agnostic wire format
#
# Drained from profiles/winbox-ipc/strawman/winbox-m2.ksy and the
# semantic overlay (winbox-m2-semantics.yaml). The Kaitai file is
# evidence; this YAML is canonical.
#
# Profile-naming rule: byte_2 of the 4-byte TLV header is named locally
# per profile (winbox-ipc -> namespace; dude-on-disk -> marker;
# winbox-cdb -> tag-1 / record-type discriminator). The physical layer
# only declares its width and position.
---
m2ir-version: 0.1
schema-version: 0.1

id: nv-message
title: nv::message TLV grammar (M2)
aka:
  - nova-message
  - M2
endian-policy: |
  Bytes inside the 4-byte header and inside `payload` numeric fields are
  little-endian (LE). The chunked transport layer that wraps M2 (see
  profiles/winbox-ipc/transport.yaml) is big-endian (BE) for its own
  length/tag fields, so an M2 blob lives inside a BE frame but is
  internally LE. Keep the boundary explicit when consuming bytes.
  EXCEPTION (handler-scoped): some u32-tcode fields carry BIG-endian
  bytes — IPv4 address/network/netmask/broadcast on [20,1], read via
  the first-party `be32` accessor (same wire tcode 0x08/0x09, network
  byte order). Profiles mark such fields `tcode: be32`; see
  profiles/winbox-ipc/gui-handlers.yaml ip-address.

confidence: documented
evidence:
  - source: code
    ref: "Cisco-Talos Winbox_Protocol_Dissector"
    url: "https://github.com/Cisco-Talos/Winbox_Protocol_Dissector"
  - source: doc
    ref: "MarginResearch — Pulling MikroTik into the Limelight"
    url: "https://margin.re/2022/06/pulling-mikrotik-into-the-limelight/"

notes: |
  An nv::message blob is the literal ASCII bytes "M2" followed by zero or
  more TLV entries until end-of-stream (or, for nested messages, until
  the enclosing length boundary). Each entry is a 4-byte header plus a
  variable payload selected by the `tcode` byte.

  Within RouterOS source the textual form of nv::message also exists but
  is deprecated and not covered here.

# ── magic ────────────────────────────────────────────────────────────────
magic-prefix:
  bytes: [0x4d, 0x32]
  ascii: "M2"
  required-on: [root, nested]
  confidence: documented
  evidence:
    - source: doc
      ref: "MarginResearch — distinguishes nv::message binary form from deprecated pseudo-JSON form"

# ── 4-byte TLV entry header ──────────────────────────────────────────────
header:
  size: 4
  fields:
    - name: key_low
      width: u1
      role: "low byte of the 16-bit key index inside byte_2's role"
    - name: key_high
      width: u1
      role: "high byte of the 16-bit key index"
    - name: byte_2
      width: u1
      role: "profile-defined; namespace in winbox-ipc, marker in dude-on-disk"
      profile-naming: required
    - name: tcode
      width: u1
      role: "selects payload encoding from `tcodes:` table; bit 0 sometimes used as compact-flag (profile-defined)"
  derived:
    full_key:
      formula: "(byte_2 << 16) | (key_high << 8) | key_low"
      role: "24-bit key used in cross-tool tables. Not unique on its own: one message can carry the same full_key under two type classes (see typed_key)."
    key_id:
      formula: "key_low | (key_high << 8)"
      role: "16-bit key index inside the chosen byte_2 role"
    type_class:
      formula: "(tcode & 0x78) >> 3"
      values: { 0: bool, 1: u32, 2: u64, 3: bytes16, 4: string, 5: msg, 6: bytes }
      role: "value type with the compact bit (bit 0) and the array bit (bit 7) removed. Compact pairs (0x08/0x09, 0x20/0x21, ...) and bool_false/bool_true share a class."
      confidence: inferred
      notes: "Consistent with every tcode in the table below. RouterOS's own UI descriptors and WebFig use one letter per class (see profiles/winbox-ipc/profile.yaml key-id.type-letters)."
    is_array:
      formula: "(tcode & 0x80) != 0"
      confidence: inferred
    typed_key:
      formula: "(full_key, type_class, is_array)"
      role: "attribute identity. Two entries with the same full_key and different type classes are two attributes, not a repeat or a conflict."
      confidence: observed-only
      evidence:
        - source: sample
          ref: "7.25 bridge row on [20,0] carries 0x000010 as u32 (0x09) and as string (0x21) in one message; see profiles/winbox-ipc/gui-handlers.yaml interface"
        - source: doc
          ref: "RouterOS 6.49.23/7.25/7.26beta4 roteros.jg Bridge dialog: u10 'Region Revision' and s10 'Region Name'; see work/2026-11-jg-descriptors/README.md"

# ── tcode -> payload-rule table ──────────────────────────────────────────
# Each tcode is its own enumerant; profiles may pair adjacent tcodes
# (e.g. 0x20/0x21) under a `compact-rule:`. The physical layer stays
# neutral on that pairing.
tcodes:
  0x00:
    name: bool_false
    payload: none
    value: false
    confidence: documented
    notes: "Boolean value carried entirely in the tcode byte; no payload bytes consumed."
  0x01:
    name: bool_true
    payload: none
    value: true
    confidence: documented
  0x08:
    name: u32_wide
    payload: { fixed: 4, endian: le }
    confidence: documented
    notes: "Handler-scoped exception: be32 fields (e.g. [20,1] IPv4) reuse this tcode with big-endian bytes — see endian-policy."
  0x09:
    name: u32_compact
    payload: { fixed: 1 }
    confidence: documented
    notes: "1-byte unsigned value; profiles that pair with 0x08 use this as a compact-length variant. Live: u8-vs-u32 switching by magnitude is confirmed (bridge mtu auto=0/u8, 9000/u32; CMD=7/u8 vs 0xFE0000-range/u32)."
  0x10:
    name: u64_wide
    payload: { fixed: 8, endian: le }
    confidence: documented
    notes: "No compact variant defined; 0x11 is unallocated."
  0x18:
    name: bytes_16
    payload: { fixed: 16 }
    confidence: documented
    notes: |
      16 raw bytes. Profiles bind this to ipv6-addr (winbox-ipc SYS_RADDR6,
      MNDP-equivalent concept). Surprise: NOT a signed integer despite
      sitting between u32 and u64 in the tcode space.
    evidence:
      - source: code
        ref: "Cisco-Talos Winbox_Protocol_Dissector — ip6_addr handling"
  0x20:
    name: string_wide
    payload: { len-prefix: u16le, body: utf8 }
    confidence: documented
  0x21:
    name: string_compact
    payload: { len-prefix: u8, body: utf8 }
    confidence: documented
  0x28:
    name: msg_wide
    payload: { len-prefix: u16le, body: nv-message }
    confidence: documented
    recursion: true
  0x29:
    name: msg_compact
    payload: { len-prefix: u8, body: nv-message }
    confidence: documented
    recursion: true
  0x30:
    name: bytes_wide
    payload: { len-prefix: u16le, body: opaque }
    confidence: documented
  0x31:
    name: bytes_compact
    payload: { len-prefix: u8, body: opaque }
    confidence: documented
  0x80:
    name: bool_array
    status: declared-unwired
    confidence: inferred
    notes: |
      Forward-declared in RouterOS source but never registered in the
      Cisco-Talos dispatch table. Not observed in any public capture.
      Encountering one in real traffic should stop the parse and capture
      the bytes for analysis. Lead (2026-11-21): RouterOS UI descriptors
      declare one bool-array field ('B' letter) on 6.49.23 and 7.25; not
      yet seen on the wire.
  0x88:
    name: u32_array
    payload: { count: u16le, item: u32_wide }
    confidence: documented
  0x98:
    name: bytes16_array
    payload: { count: u16le, item: bytes16 }
    confidence: observed-only
    notes: |
      First sighting: USER field 201 (0xc9) on a v7 PPPoE-client
      interface row, one all-zeros 16-byte element (unset IPv6
      address shape — role open). Decoded by alignment (u16 count
      + 16B items yields clean entry boundaries into a following
      0x88 field). Project-named; no documented label.
    evidence:
      - source: sample
        ref: "live CHR interrogation (fields batch, 7.25); see work/2026-10-chr-extraction/ws3c-prober-findings.md §19"
  0x90:
    name: u64_array
    status: declared-unwired
    confidence: inferred
    notes: |
      Forward-declared in RouterOS source, never wired up in the dispatch
      table per Cisco-Talos source review. Sample sightings reported in
      public sources but no parse implementation; treat as unknown.
      Lead (2026-11-21): RouterOS UI descriptors declare u64-array
      fields ('Q' letter, type 'multibignumber') on [20,0] interface
      statistics: 69 on 6.49.23, 148 on 7.25. A native [20,0] statistics
      read should show whether 0x90 is wired; the payload shape is
      unconfirmed until then.
  0xa0:
    name: string_array
    payload: { count: u16le, item: string_wide }
    confidence: documented
  0xa8:
    name: msg_array
    payload: { count: u16le, item: msg_wide }
    confidence: documented
    recursion: true
  0xb0:
    name: bytes_array
    status: descriptor-only
    confidence: inferred
    notes: |
      Not in any public dispatch table. Inferred from the type_class
      formula (class 6 bytes | array bit) and from RouterOS UI
      descriptors, which declare raw-array fields ('R' letter, type
      'multiraw'), for example DHCP client [43,3] Valid Servers. Not seen
      on the wire; stop the parse and keep the bytes if one appears.

# ── recursion ────────────────────────────────────────────────────────────
recursion:
  via-tcodes: [0x28, 0x29, 0xa8]
  rule: |
    A nested message starts with the same M2 magic and contains TLV
    entries until its length-prefix boundary. Recursion is unbounded in
    the format; profiles MAY cap depth at the application layer.

# ── structure ────────────────────────────────────────────────────────────
structure:
  root:
    seq:
      - { name: magic, kind: magic-prefix }
      - { name: entries, kind: tlv-entry, repeat: eos }
  tlv-entry:
    seq:
      - { name: header, kind: header }
      - { name: payload, kind: by-tcode, ref: "tcodes[header.tcode].payload" }

# ── investigation trail ──────────────────────────────────────────────────
investigation-trail:
  - date: 2026-05-03
    finding: |
      Drained from strawman .ksy + semantic overlay. Naming of byte_2 is
      deferred to profiles per DESIGN.md §3 ("profile-agnostic physical,
      profile-specific naming"). The compact-flag interpretation of the
      low bit of `tcode` is also a profile concern: winbox-ipc treats
      0x21/0x29/0x31 as the compact pairs of 0x20/0x28/0x30, but
      dude-on-disk decides compactness from `byte_2` (marker) instead.
  - date: 2026-10-31
    finding: |
      WS-4 drain: be32 handler-scoped endianness exception (same tcode,
      big-endian bytes — proven live on [20,1] IPv4 + first-party be32
      accessor) and live confirmation of compact-pair switching by
      magnitude (u8/u32, string_c/string_wide). A from-scratch M2 codec
      reproduces a real-client capture byte-for-byte (asserted on every
      WS-3C prober login).
  - date: 2026-11-21
    finding: |
      Typed identity: full_key alone does not identify an attribute. A
      bridge row carries 0x000010 as u32 and as string; RouterOS's own UI
      descriptors name them separately (u10 Region Revision, s10 Region
      Name). Added type_class / is_array / typed_key, plus descriptor
      leads for 0x80, 0x90 and a new 0xb0 entry.
