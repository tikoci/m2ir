lifecycle_design:
  target: "U-jump-0xfd002a: 0xfd002a/0x21 empty-string adjunct — absent on the J1 fresh jump row, present-from-J2 (only stimulus: the jump-target set), retained post-SETOBJ, absent on accept rows; semantics unknown, never varied"
