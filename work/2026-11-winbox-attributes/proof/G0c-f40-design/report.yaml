  experiments:
    - id: L1-vary
      stimulus: "/ip/firewall/filter/set <host-id> jump-target=g0cjt2"
      operational_meaning: "VARY the suspected trigger: replicates the exact J1->J2 stimulus (a jump-target set) with a distinctive value B on a fresh host row"
      native_read: "control read-back + GETALL [20,3] x2 (unchanged-read pair)"
      outcome_appears: "0xfd002a appears (or changes) -> edit-stimulus CONFIRMED as the trigger class; J1->J2 transition replicated on demand"
      outcome_absent: "0xfd002a stays absent -> J2 appearance was confounded (not caused by the set); creation-vs-edit origin question reopens"
      outcome_value_nonempty: "0xfd002a carries a non-empty value -> it is a VALUE channel, not a presence flag; enumerate the value against the stimulus"
      cost: "1w"
    - id: L2-clear-attempt
      stimulus: "/ip/firewall/filter/set <host-id> jump-target=g0cjt (REVERSAL to value A per C.3)"
      operational_meaning: "CLEAR attempt via reversal: tests whether 0xfd002a is transient (tracks current edit state) or sticky (latched by the first set)"
      native_read: "control read-back + GETALL [20,3] x2"
      outcome_clears: "0xfd002a disappears (or reverts) -> TRANSIENT edit-marker reading supported"
      outcome_persists: "0xfd002a retained -> STICKY-once-set reading supported (adjunct survives the reversal that created it)"
      end_state: "host row back to jump-target=g0cjt regardless; ready as the R1/R2 host"
      cost: "1w"
retention_design:
  target: "U-jump-f41-lifecycle: J3 single-sample observation — after native SETOBJ f40 1->0, control *1 reads action=accept with jump-target GONE while the native row RETAINS f41='e3jump2' + 0xfd002a='' (adjunct-retention divergence, NOT full split-brain: action agreed both sides)"
  host: "C2 jump-host row after L2 (jump-target=g0cjt); runs AFTER lifecycle"
  experiments:
    - id: R1-control-exit
      stimulus: "/ip/firewall/filter/set <host-id> action=drop"
      operational_meaning: "exit jump via the CONTROL plane (not a native SET): tests whether J3 retention is general action-exit behavior or SETOBJ-specific. drop (not accept) is chosen so the exit target is itself a matrix-mapped value, cross-checking M1 from a second direction"
      native_read: "control read-back (expect action=drop, jump-target gone) + GETALL [20,3] x2"
      outcome_retained: "native f41 + 0xfd002a retained while control drops jump-target -> retention is GENERAL action-exit behavior; J3 was not a SETOBJ artifact"
      outcome_cleared: "native f41/0xfd002a cleared with the control drop -> retention was J3/SETOBJ-specific (native write bypasses the control-plane cleanup that a control set performs)"
      outcome_f40: "f40 must read the M1-mapped drop value natively; any other value reopens M1"
      cost: "1w"
    - id: R2-reentry
      stimulus: "/ip/firewall/filter/set <host-id> action=jump jump-target=g0cjt3"
      operational_meaning: "RE-ENTER jump with a third distinctive target: tests adjunct lifecycle across a full exit+re-entry cycle and whether re-entry overwrites or compounds retained adjuncts"
      native_read: "control read-back + GETALL [20,3] x2"
      outcome_clean: "f41='g0cjt3', 0xfd002a present-or-absent per the L1/L2 model -> re-entry is a clean overwrite; lifecycle model closes"
      outcome_compound: "stale f41 value lingers alongside, or 0xfd002a shows a THIRD state -> exit+re-entry compounds; lifecycle model needs a third state"
      end_state: "host row is a jump row again; removed only at restore"
      cost: "1w"
