  ordering: "WinBox-visible-menus-first, then centrs-retrieve usefulness (per plan section E: UI/explain usefulness over raw row counts)"
  bound_check: "every family <=10 candidate properties and <=1 private verb"
  batch_1a:
    - family: 1a-A-defconf
      handlers: [default-config]
      routes: [[24, 8]]
      candidate_count: 4
      private_verbs: 0
      why_first: "WinBox-visible (first-connect default-configuration dialog) AND fully CHR-populated: the only tail handler distinguishable now with zero hardware."
    - family: 1a-B-qos-profile-map
      handlers: [qos-profile-20-114, qos-map-20-115]
      routes: [[20, 114], [20, 115]]
      candidate_count: 8
      candidate_split: "profile menu 6 + map menu 2"
      private_verbs: 0
      why: "WinBox-visible (Switch > QoS); cleanest 1:1 name-plausible menus of the tail; profile+map pair fits one worker under the bound."
  batch_1b:
    - family: 1b-A-qos-config
      handlers: [qos-config-20-122]
      routes: [[20, 122]]
      candidate_count: 7
      private_verbs: 0
      why: "QoS composite head; CHR leg pins 255-heavy defaults + version scope; populated rows await switch hardware."
    - family: 1b-B-qos-pfc
      handlers: [qos-pfc-20-126]
      routes: [[20, 126]]
      candidate_count: 7
      private_verbs: 0
      why: "PFC is the most operationally distinct QoS slice (rx/tx/thresholds); same CHR-defaults-then-hardware shape as 1b-A."
  future_families:
    - family: modem-pair
      handlers: [sim-settings-20-107, modem-aux-20-61]
      routes: [[20, 107], [20, 61]]
      candidate_count: 10
      candidate_split: "lte/settings 7 (sim-slot, sim-link, mode, firmware-path, info-polling-interval, link-recovery-timer, external-antenna) + lte row 3 (pin, sms-protocol, network-mode)"
      private_verbs: 1
      private_verb: "[20,61] slot-19/private 5 (role unknown; private 6/7 explicitly deferred to a follow-up)"
      why: "Shared LTE/modem/winbox-retrieve theme (modem status + SIM slots); blocked on registered-modem hardware."
    - family: board-info
      handlers: [dbrd-holder-24-35]
      routes: [[24, 35]]
