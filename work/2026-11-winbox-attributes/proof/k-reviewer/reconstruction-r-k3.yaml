independent_verdict:
  drift_beta4:
    r13_5: "NONE: seq1 = 10 entries identical to ev baseline incl order (f5=[]u32arr, f1=F, f2=T, f4=1, ff0003=2, ff0006=2, f3=0 trailing); also matches beta4-user-family get-13-5-bare-rx modulo reqId echo (2 vs 28)"
    r13_9: "NONE: seq9 = {ff0003=2, f1=0, f2=0} identical to ev baseline modulo proxy string + reqId echo (6 vs 2)"
    r13_6_admin: "NONE: beta4 seq1 + 7.25 seq1 both 5-entry SYS-only EMPTY, identical to ev admin baseline modulo proxy string"
    r13_8: "NONE: beta4 GETALL seq1 = 1 row {0xfe0001=0, 0xfe0010='default'} total 1; GETCOUNT seq3 total 1 — identical to beta4-user-family getall/getcount-13-8-rx modulo reqId echo"
  gating:
    r13_5: "GET-only: GETALL seq3 -> 0xFE0003, GETOBJ obj=1 seq5 -> 0xFE0003, GETCOUNT seq7 -> ok + 0xFFFFFFFF (all from [13,5])"
    r13_9: "GET-only: GETALL seq11 -> 0xFE0003, GETOBJ seq13 -> 0xFE0003, GETCOUNT seq15 -> ok + 0xFFFFFFFF (all from [13,9])"
  r13_6_coverage:
    tested_live: "exactly 2 variants x 2 versions: f1='admin' -> EMPTY success (5 SYS entries); bare GET -> FAILED 0xFE0006 (16646150) + errstr 'no user name provided'"
    admin_sole_variant: false
    sole_evidence: "admin is NOT the sole read-only variant: queue-3 fixtures ALREADY contain f1='nosuchuser' GETs on all 3 versions (incl 7.26beta4-user-family get-13-6-nosuchuser-rx = SYS-only EMPTY, byte-shape identical to admin modulo reqId echo 30 vs 29). K3 did not re-run nosuchuser (census.ts takes a single --f1; captures show only admin + bare). Any 'admin is sole' claim is contradicted by the fixtures; at most 'admin is the sole variant K3 re-ran' holds."
    bare_errstr: "0xff0009='no user name provided' with errno 0xFE0006 on BOTH versions (beta4 seq3, 7.25 seq3) — errstr stable across versions"
