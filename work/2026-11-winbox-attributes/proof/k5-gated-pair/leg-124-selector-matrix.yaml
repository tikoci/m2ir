  - "X1 veth-hit leg (needs pre-existing veth or a write-budget provisioning leg)"
  - "X2/X3 private cmd 1/2 legs (private-verb batch with write budget + netns-restore plan)"
  - "U-k5-130-sibling-role + U-k5-mode2-reply-shape (future family/private-verb batches)"
