  shared: "both are v7 net selector-gated handlers with slot-7 involvement; both motivated a read-only request-extra matrix; both pair a CHR-absent resource (modem / veth+container) with negative-only live legs."
  contrasts:
    - "selector SHAPE: 61 = request f7 STRING (modem key, store->lookup); 124 = request f1005 U32-ARRAY (row-ids, validation ladder). The 61 precedent predicted 'selector in extras' but no field detail transferred (H5 dead)."
    - "miss SIGNAL: 61 = UNKNOWNID 0xfe0004, no errstr; 124 = FAILED via failedMsg + errstr ladder (5 distinct strings). 124's ladder is far more discriminating per request."
    - "verb STRUCTURE: 61 = slot-9 cmdGet + slot-7 pre-filter for other cmds, unhandled verbs = base NOTIMP; 124 = SINGLE slot-7 funnel for all verbs, standard verbs -> explicit NOTIMP only after validation (P-static-5)."
    - "positive SHAPE: 61 has one (0x411 nested / 0x3fa array) gated on hardware; 124 has NO GET-family positive shape at all (best case NOTIMP) — the matrix proves wiring, never rows."
    - "hardware GATE: 61 needs a registered modem for a hit; 124 needs pre-existing veth interfaces for full-validation (NOTIMP) — both CHR-absent by default, but 124's PARTIAL ladder ('is not veth' with name echo) is reachable on a stock CHR with plain ether/lo ids."
