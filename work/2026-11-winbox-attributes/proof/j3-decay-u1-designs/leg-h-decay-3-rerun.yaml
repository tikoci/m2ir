async_match_rule: "match SYS_CMD=0xfe0014 pairs on SYS_REQID (mandatory): leg A TO=[] FROM=[0xff0003,slot] + leg B TO=[] FROM=[2,slot] policy-1, slot=(ctr<<8)|6. Record per pair: arrival t-t0, slot/ctr advance, leg sizes (expect A~30B B~38B per queue-3). Count pairs + ctr advance per inter-rung window. ANY non-pair async (handler-shaped traffic) is novel: report separately, never force into the pair count."
outcomes:
  - id: B1-decay-async-coincident
    condition: "spike2 (R0a>0) + value drops across rungs AND >=1 matched 0xfe0014 pair arrives inside the decay window (drop when pairs arrive; pair count or ctr advance scales with spike magnitude) + S0 clean"
    verdict: "H-decay-3 SUPPORTED (TIER 1). H-decay-1 variable-gauge WEAKENED (a pure internal gauge needs no fabric traffic). Multi-step one-shot + history-gating WEAKENED as decay drivers (the decay IS the backlog draining); survive only as magnitude-gating (why this spike this size)."
  - id: B2-decay-zero-async
    condition: "spike2 + decay completes (or graded-drops) with ZERO async in-window (all rungs + keepalives + final drain async=0) + S0 clean"
    verdict: "H-decay-3 DEAD and churn-artifact DEAD as the decay driver (TIER 1; the A2 design finally testable). H-decay-1 variable-gauge + H-decay-4-multi-step REMAIN (internal mechanism). History-gating OPEN."
  - id: B3-second-stable-repeat
    condition: "spike2 + NO decay across R0a..R5 (flat at R0a through the R2/R3 gate and to R5) regardless of async silence"
    verdict: "decay-correlation UNTESTABLE a second time; H-decay-3 stays UNTESTED. Consistent with H-decay-1 variable-gauge; third stability sample (modal shape now 3/5 timed samples). Report curve; no model killed; no claim for/against H-decay-3."
  - id: B4-spike2-absent
    condition: "R0a=0 and R0b=0 with the S2 rule present (read-back valid)"
    verdict: "re-spike FAILED: per-add-transient WEAKENED (P-h1-respike not replicated). H-decay-1 DEAD in per-add-gauge form (a per-add gauge must re-spike). History/session-gating PROMOTED to lead (spike gated by session/rowid/history, not by the add alone). H-decay-4 survives only session-scoped (narrowed; needs a rowid-freshness follow-up). H-decay-3 untestable this attempt. 3w spent; report."
  - id: B5-shape-split
    condition: "SECONDARY, within B1/B2: graded (>=2 distinct intermediate TIER 1 values between peak and floor) vs step (peak then floor, no middle)"
    verdict: "graded -> single-step one-shot DEAD in TIER 1 (upgrades H1's TIER 2 graded kill); multi-step one-shot REQUIRED if one-shot survives. Step -> shape-varies-per-add (extends D-h1-fixed-curve; single-step revived as a per-add variant, in tension with H1 TIER 2 graded: report the tension, do not adjudicate)."
  - id: B6-ambiguity-stop
    condition: "S0 draws pairs (or any async) with no rule stimulus"
    verdict: "AMBIGUITY STOP (A4 analog): churn model incomplete; no mechanism claim in either direction; re-plan."
  - id: B7-partial
    condition: "rung-*-failed (session death despite keepalives) at any rung"
    verdict: "PARTIAL (A6 analog): committed rungs are TIER 1 (write-through); remaining scale via session-per-read fallback; async account covers the committed window only; report the death as a third idle sample (after H1 idle-death-1/2)."
magnitude_secondary: "add2 magnitude vs add1 magnitude (both TIER 1): EQUAL -> history-gating WEAKENED (different histories, same magnitude); DIFFERENT -> history-gating CONSISTENT (magnitude gated by history/rowid/session; the H1 1-vs-4 puzzle persists). Never a standalone kill; recorded alongside B1..B4."
q1_annex_reattach:
  standing: "Q1 annex STOOD DOWN stays stood-down unless the run is decaying. This sheet states RE-ATTACH CONDITIONS ONLY; the annex design (I2-annex-q1-dip) is unchanged."
  operational: "S2 AND S0 ladders run with --keepalive-ms 5000 UNCONDITIONALLY (0w marginal; reads do not disturb, H-decay-2 dead; matched-traffic control preserved). Operationally the annex flag is always set (H-decay-3 execution precedent: attached under the per-leg yes with conditional stand-down honored)."
  analytic_trigger: "DECAY-CONFIRMED (R1<R0a OR R2<R0a) or DECAY-CONFIRMED-LATE (R3<R0a), TIER 1 -> annex ACTIVE: analyze the +60..+120s K-samples (~12 TIER 1 points plus rungs R3/R4) under Q-dip-anomaly (exactly one low outlier) / Q-oscillation (>=2 spaced troughs, >=10s Nyquist bound) / Q-neither (flat in-window: dip not replicated, per-add variability)."
  stand_down: "flat R0a..R3 -> Q-stand-down: K-samples fold into the B3 stability record; 0 spent beyond the host leg in all branches."
  secondary_d_polls: "ONLY if primary shows a dip or oscillation: post-ladder (rule STILL present, async account closed), <=4 session-per-read polls at +330s/+360s/+390s/+420s post-t0 (step-D*.jsonl), plateau-persistence purpose per annex design."
thread5_interaction:
  recommendation: AGAINST
  reasons:
    - "Same-table mutation: T5-b/T5-c `set` commands mutate filter rows on the table the watched gauge/backlog is associated with. Interleaved sets are a perturbation confound (possible re-spike or value shift mid-window) and would void the B1/B2 discrimination."
    - "Async-account contamination: control-plane sets may emit announce traffic on the ladder session, destroying the decay/async coincidence account (the entire point of this leg)."
    - "Restore coupling: T5-c fasttrack sets risk the G1 'special dummy' side effect and a PARTIAL restore, which would taint this leg's clean-restore record."
    - "Budget coupling: piggyback inflates one per-leg yes from 3w to 7-8w and couples two outcomes' fate. The decay window's value is its pristine shape; do not dilute it."
  acknowledged_for:
    - "Saves a boot; the spike2 row is present and could host sets-only cells after the ladder closes."
  priced_option_not_recommended: "post-R5 (and post-D-polls if any) T5-b+T5-c sets-only on the spike2 row: 4-5w marginal (sets only, host owns add+restore), total 7-8w+0r. T5-a EXCLUDED (its own adds = new [20,32] stimuli; rides a future leg with spare add budget per its sheet). Coordinator may price this, but J3 recommends a clean 3w decay leg with T5 riding the next filter-write leg instead."
evidence_tiers: "TIER 1 throughout: committed rx bytes + relative timestamps (step-*.jsonl write-through) + timing ledgers (rung-*-start/end, keepalive-K*, drain) + tee'd consoles (console-negcontrol.txt, console-ladder.txt). No H1-style TIER 2 ladder values by construction."
fixed_script_live_validation:
  - "L1 write-through: `wc -l step-ladder.jsonl` grows during the run (checked after R0a)"
  - "L2 per-rung account FULL: every rung has a console line (v32+async+records) in the TEE'D console file AND a rung-*-end ledger event with matching counts (H-decay-3 L2-lesson fix: console piped through tail is not evidence)"
  - "L3 keepalive cadence: keepalive-K* ledger events space <=10s across every inter-rung gap at 5s setting; count matches the --dry-run plan for the elapsed prefix"
  - "L4 no-reconnect: exactly one session-open/session-close pair per ladder invocation in the ledger (a reconnect would be churn)"
  - "L5 post-run replay: every record in step-*.jsonl decodes via replayBytes (no truncated lines from a mid-append death)"
  - "L6 death drill (only if B7): the rung-*-failed ledger event exists AND all pre-death rungs are byte-complete in the step file"
spend: { counted_writes: 3, reboots: 0, cap_note: "3w+0r fixed; no extension, no re-spike improvised (B4 is a result, not a retry prompt)" }
