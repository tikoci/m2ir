host_spike_grounding:
  choice: "2nd in-session /ip/firewall/filter add (H1 spike2 analog)"
  why:
    - "P-h1-respike (H1 report): 2nd in-session add RE-SPIKED (S1zero=0 -> nonzero with the rule present, TIER 1 fact): the spike is a per-add transient, so a 2nd add is a fresh host, not a re-read of spike1."
    - "P-h1-graded-decay (H1 report): spike2 decayed GRADED in-session (R0a(+5.4s)=4 R0b=4 R1(+10s)=3 R2(+30s)=2, TIER 2; then Q1(+84.7s)=1 Q2=2 Q3=2 Q4=2 dip+plateau, TIER 1). The 2nd in-session add is the ONLY spike shape with observed in-session decay."
    - "Prior modal shape is stability-at-1 (H1 spike1 + H-decay-3 A3: 2/4 timed samples). A 1st-add host risks a third A3; the 2nd-add host is the only grounded decaying candidate."
    - "Carried recommendation: H-decay-3 execution report unresolved U-h1-32-mechanism next-step names exactly this ('consider a second in-session add (H1 spike2 decayed) as the decaying host')."
  caveat: "H1 spike2 magnitude (4) and graded shape rest partly on TIER 2 (ladder rx bytes lost to idle-death-1). The re-spike FACT and dip+plateau are TIER 1. This leg re-proves the graded shape in TIER 1 if B1/B2 lands."
decay_gate:
  decision: "IN-LADDER gate at R2/R3. No separate pre-ladder M0-style reads."
  pre_ladder_reads_considered_and_rejected:
    - "Two session-per-reads (e.g. +8s/+20s) before the ladder would delay ladder start past +25s and CONSUME the fast-decay window: H1 spike2's graded decay ran +5s..+30s. A pre-gate that reads flat at +20s cannot distinguish stable from slow-decay (G3 decayed ~+60s), so it buys no decision while risking the window."
    - "Session-per-reads ahead of the ladder are async-clean (P-h1-async-silence: 11 drains async=0), so the rejection is about the WINDOW, not contamination. If the coordinator wants belt-and-braces, ONE pre-ladder read at +8s is acceptable cost (0w) but it must not delay ladder spawn."
  gate_rule:
    - "R0a (first ladder rung, target <+10s post-add; see start-latency note) is the spike2 magnitude baseline, TIER 1."
    - "DECAY-CONFIRMED if R1 < R0a OR R2 < R0a (any strict drop by +30s; H1-spike2 analog decayed by R2)."
    - "Else DECAY-CONFIRMED-LATE if R3 < R0a (+60s; G3 analog)."
    - "Else (flat R0a..R3) -> STABLE: B3 branch (complete ladder to R5 for the third stability sample; Q1 annex stands down)."
    - "Threshold summary: decaying = any rung value strictly below R0a on committed TIER 1 rx bytes; stable = all rungs equal R0a through the gate."
    - "Non-monotonic (dip-then-rise) -> RECORD and CONTINUE (H-decay-3 deliberate deviation from H0a-b flap-stop; H1 Q1-dip precedent)."
  start_latency_note: "H-decay-3 ladder started ~+12s post-t0 (S1 read-back + spawn gap). Sub-12s decay would be invisible. No observed spike decayed that fast (fastest: H1 spike2 graded over +5..+30s; even a +12s start lands mid-curve on a spike2 analog). Executor must pre-stage the ladder command and minimize the read-back->ladder gap (target R0a <+10s); the S2 control read-back stays MANDATORY (stimulus validity beats speed)."
