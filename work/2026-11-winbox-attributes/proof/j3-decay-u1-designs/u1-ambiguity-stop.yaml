rosetta_queries_run:
  note: "Every query below ran via `sqlite3 -readonly ~/.rosetta/ros-help-0.12.0.db`. SQL verbatim for reproducibility; digest states the result. CLI names are candidates only, never numeric proof."
  queries:
    - id: Q1
      sql: "SELECT e.source_path, e.source_type, e.package, p.manual_version FROM cliref_entries e JOIN cliref_pages p ON p.id=e.page_id WHERE e.source_path LIKE '%default-configuration%' ORDER BY p.manual_version, e.source_path;"
      digest: "5 entries x3 manuals (system/default-configuration + 4 subdirs), all 'Settings Directory'."
    - id: Q2
      sql: "SELECT e.source_path, f.name, f.field_kind, f.raw_type, f.mandatory, f.unsettable FROM cliref_fields f JOIN cliref_entries e ON e.id=f.entry_id JOIN cliref_pages p ON p.id=e.page_id WHERE e.source_path LIKE '%default-configuration%' AND p.manual_version='7.26' ORDER BY e.source_path, f.source_order;"
      digest: "4 fields on the parent + 1 per subdir, ALL Read-only Argument string, mandatory=0 unsettable=0."
    - id: Q3
      sql: "SELECT path, type, type_tag FROM schema_nodes WHERE path LIKE '%default-configuration%' ORDER BY path, type LIMIT 60;"
      digest: "dir + export/get/print cmds + their args; no set/add among the first 60."
    - id: Q4
      sql: "SELECT count(*) FROM schema_nodes WHERE path LIKE '%default-configuration%';"
      digest: "83 nodes (includes 3 /tool/netinstall apply-default-configuration arg hits — the netinstall lead)."
    - id: Q5
      sql: "SELECT DISTINCT substr(path, length('/system/default-configuration/')+1) FROM schema_nodes WHERE path LIKE '/system/default-configuration/%' AND type='cmd';"
      digest: "cmds are export/get/print on the parent + caps-mode-script/custom-script/script subdirs. No set/add/edit/remove/unset. NOTE: the inspect tree has only 3 subdirs (no wps-sync-mode-script subdir) while cliref documents 4 (Q1); the parent still carries all 4 fields (Q2). No writer in either source."
    - id: Q6
      sql: "SELECT path, type FROM schema_nodes WHERE path LIKE '%default-configuration%' AND path NOT LIKE '%/export/%' AND path NOT LIKE '%/get/%' AND path NOT LIKE '%/print/%' ORDER BY path;"
      digest: "parent dir + 3 subdirs (caps-mode-script, custom-script, script), each with export/get/print only; NO wps-sync-mode-script subdir in the inspect tree (cliref-only entry per Q1/Q2); plus the 3 netinstall apply-default-configuration args."
    - id: Q7
