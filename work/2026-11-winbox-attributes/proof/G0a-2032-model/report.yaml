      decides: "M5=1 (== P3 {J,A}) kills pure order-dependence; M5!=1 proves insertion order contributes (first/last-wins classes revive in modified form)."
    - id: M6-input-chain-optional
      writes: 1
      rule_set: "{A on chain=input}"
      steps: ["/ip/firewall/filter/add chain=input action=accept comment=m2g0a6", "control read-back + native read (as M1)", "remove the rule"]
      decides: "M6=8 kills chain-dependence; M6!=8 proves the chain contributes to the value."
    - id: M7-restore-verify
      writes: 1
      steps: ["5-menu control verify (0 rows each)", "native read ([20,3]=0 [20,32]=0, GETALL 0 rows complete)"]
