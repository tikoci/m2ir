      steps: ["/ip/firewall/filter/add chain=forward action=jump jump-target=m2g0aj1 comment=m2g0a4a", "/ip/firewall/filter/add chain=forward action=jump jump-target=m2g0aj2 comment=m2g0a4b", "control read-back (2 jump rows) + native read", "remove both rules"]
