r3a_h1_decaying_spike:
  question: "from proof/H1-decay/ evidence, did an in-session filter-add spike DECAY (which spike, what samples, what tier)?"
  method: "independent re-extraction of GETCOUNT [20,32] totals from all H1 step-*.jsonl rx records + timing ledgers; checked for step-ladder.jsonl on disk"
  spike1_first_add:
    decayed: false
    samples: "[20,32]=1 on all 6 reads: S1 (+10.1s) + P1..P5 (+77.2s/+148s/+217s/+287s/+354.1s post-add)"
    tier: "TIER 1 (committed rx bytes in step-S1/P1-P5.jsonl, 8 recs each; offsets in timing-S1/P1-P5.jsonl)"
    evidence:
      - work/2026-11-winbox-attributes/proof/H1-decay/step-S1.jsonl
      - work/2026-11-winbox-attributes/proof/H1-decay/step-P1.jsonl
