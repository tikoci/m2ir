  vrf_key: "f6=1 on B's row UNCONDITIONALLY (VRF1 .id *1)"
  self_offset: "f6=(B.rowid-1): =2 if B lands *3 (reuse, expected) else 3+ if monotonic — in ALL cases != 1"
