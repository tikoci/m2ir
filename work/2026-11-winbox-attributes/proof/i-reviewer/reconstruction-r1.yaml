minimal_discriminating_setup:
  verdict: "baseline alone INSUFFICIENT (VRF1 does not exist at baseline); PARTIAL rebuild required (VRF1 only — no bridge, no VRF2)"
  steps:
    - "1. vrf/add name=<fresh> interfaces=ether2 (ether2 free at baseline; H2-B1 pattern proven on this vm)"
    - "2. addr/add A <addr1>/24 interface=ether2 (lands VRF1 via interface membership; H2-B4 pattern)"
    - "3. addr/add B <addr2>/24 interface=ether2 COEXISTING with A (distinct host address, same subnet ok)"
    - "4. control read-back gates after every add (vrf=<fresh> on A and B; record B's actual .id)"
    - "5. native GETALL [20,1] (leg-g4.ts reuse, read-only); read f6 on the row with B's rowid; [20,1] row count must equal 3"
    - "6. remove B + A + VRF (.id selectors), restore-verify byte-equality vs B0"
  why_second_coexisting_address_is_minimal:
    - "ONE rebuilt address gets *2 (per reuse evidence) -> VRF-key predicts 1 AND self-offset predicts 2-1=1: NOT discriminating"
    - "TWO coexisting addresses force B.rowid >= 3 (*1 DHCP + A occupy lower .ids) -> predictions diverge under EVERY allocation behavior (reuse or monotonic)"
    - "no VRF2/bridge needed: discrimination needs only two coexisting rows in ONE VRF with distinct .ids"
