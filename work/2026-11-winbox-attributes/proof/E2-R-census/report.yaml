# ── E2-W leg sheet (DESIGN ONLY — E2-R executed zero writes) ──
e2w_leg_sheet:
  needs: "fresh per-leg user yes in-session; NOT approved"
  budget: { counted_writes: 8, reboots: 0 }
  vm: ws20
  vm_version: "7.25"
  why_this_vm: "only assigned 7.x VM with an isolated second NIC (ether2, socket-link, no addresses): synthetic rows stay off the ether1/DHCP management path. beta4 has ether1 only; ws3c6 is v6."
  ports: "resolved live per command via `quickchr inspect ws20 --json` (winbox + rest-api services); NO literal ports in this sheet or any proof file"
  rowid_rule: "DHCP row (rowid 1, 10.0.2.15/24) is NEVER the target of any write: disabling/removing it kills the control plane. All legs use synthetic rows on ether2."
  baseline_snapshot_per_leg:
    - "native GETALL [20,1] x2 (volatility) + control retrieve /ip/address + control retrieve /ip/vrf"
    - "record rowids present; leg passes only if the post-leg snapshot equals the pre-leg snapshot (rows + values)"
  hypotheses:
    f6_prime:
      hypothesis: "f6 = vrf identity of the address row (0 = main)"
      support: "vrf is the only frozen-10 candidate on this menu; f6=0 observed with control vrf=main; [20,101] 'main' registry rowid=0 (shape corroboration, follow-ws20.json)"
      rules_out_if: "f6 stays 0 on a row whose control read shows vrf=m2ir-vrf"
    f6_alt:
      hypothesis: "f6 = creation-source/flags word (dynamic/DHCP-created vs static)"
      support: "u32 zero on the single observed (dynamic) row; no second row exists to compare — E2-R could not discriminate"
      rules_out_if: "f6 identical on static vs dynamic rows while vrf varies it (leg B), or f6 moves with vrf while static-vs-dynamic stays equal"
    f11_prime:
      hypothesis: "f11 = slave flag (control /ip/address slave)"
      support: "only unmatched control bool on this menu (dynamic/fe0007, invalid/fe0008, disabled/fe000a all matched); f11=false with slave=false"
      caveat: "`slave` is OUTSIDE the frozen 10 — E2-W may TEST it, but any mapping promotion needs a coordinator unfreeze decision"
      rules_out_if: "control slave flips without f11, or f11 flips while slave stays false"
    f11_alt:
      hypothesis: "f11 = native-only derived flag (e.g. disabled-echo or DAD/duplicate state), no CLI counterpart"
      support: "none yet — survives only if all CLI-bool stimuli (disabled, slave-via-follow-up) fail to move f11"
      rules_out_if: "f11 tracks any CLI bool 1:1 across the legs"
  legs:
    - id: leg-A-static-unset-disable-delete
      counted_writes: 4
      steps:
        - { op: baseline, writes: 0, detail: "snapshot per baseline_snapshot_per_leg" }
        - { op: control-add, writes: 1, cmd: "/ip/address/add address=198.51.100.10/24 interface=ether2 comment=m2ir-e2w",
            then: "native GETALL + control retrieve; f6-exp2 reads f6 on a STATIC main-vrf row (vs dynamic rowid 1); f11 baseline; comment-set state" }
        - { op: control-unset, writes: 1, cmd: "/ip/address/set <new-id> comment=\"\"",
            then: "read; unset-vs-default for f6/f11 (comment set-at-create vs unset)" }
        - { op: control-disable, writes: 1, cmd: "/ip/address/set <new-id> disabled=yes",
            then: "read; f11-exp1 disabled-vs-present (control slave + f11 + f6); row MUST still be listed" }
        - { op: control-remove, writes: 1, cmd: "/ip/address/remove <new-id>",
            then: "read; disabled-vs-deleted; post-leg snapshot MUST equal pre-leg snapshot" }
      proves: "f6 static-vs-dynamic (f6-exp2); f11 disabled tracking (f11-exp1); comment unset-vs-default; delete-vs-disable"
    - id: leg-B-vrf
      counted_writes: 4
      steps:
        - { op: baseline, writes: 0, detail: "snapshot per baseline_snapshot_per_leg" }
        - { op: control-vrf-add, writes: 1, cmd: "/ip/vrf/add name=m2ir-vrf interfaces=ether2",
            then: "read [20,1] rows: VARY-VRF-WITHOUT-ADDRESS control — f6 on existing rows MUST NOT move (proves f6 tracks the ROW vrf, not vrf existence)" }
        - { op: control-add, writes: 1, cmd: "/ip/address/add address=198.51.100.20/24 interface=ether2",
            then: "native GETALL + control retrieve; STIMULUS GATE: control row MUST show vrf=m2ir-vrf or stop (stimulus invalid). f6-exp1 prime test: f6 nonzero? f11 under vrf?" }
        - { op: control-remove, writes: 1, cmd: "/ip/address/remove <new-id>", then: "read" }
        - { op: control-vrf-remove, writes: 1, cmd: "/ip/vrf/remove m2ir-vrf",
            then: "read; post-leg snapshot MUST equal pre-leg snapshot; ether2 back in main" }
      proves: "f6 vrf-identity prime (f6-exp1) with the without-address control; f11 under vrf change"
  outcomes_table:
    - { if: "f6 moves (nonzero/new value) ONLY on the leg-B vrf row", then: "f6 prime SUPPORTED; alt weakened (static leg-A row stayed 0)" }
    - { if: "f6 stays 0 on the vrf=m2ir-vrf row", then: "f6 prime DISPROVEN (distinct vrfs need distinct ids); alt survives iff leg-A static row differs from dynamic" }
    - { if: "f6 differs leg-A static row vs dynamic rowid 1 (same vrf=main)", then: "f6 alt SUPPORTED (creation-source/flags); prime needs the leg-B move to survive too" }
    - { if: "f11 flips with disabled=yes AND control slave flips with it", then: "AMBIGUOUS (disabled vs slave confounded) — needs the bridge-enslave follow-up (blocked, over cap)" }
    - { if: "f11 flips with disabled=yes while slave stays false", then: "f11 prime DISPROVEN; alt (disabled-derived) supported" }
    - { if: "f11 stays false through both legs", then: "disabled ruled out as f11 driver; slave-prime SURVIVES untested -> bridge-enslave follow-up leg (blocked item)" }
    - { if: "f6/f11 move on any baseline re-read (no stimulus)", then: "VOLATILE — stop, redesign; no leg conclusion valid" }
  stop_conditions:
    - "any post-step read fails or the VM is unreachable -> STOP, no reboot (0r cap), report; recovery needs a new yes"
    - "leg-B stimulus gate fails (new row shows vrf=main) -> STOP leg B, restore (remove row + vrf), report stimulus invalid"
    - "post-leg snapshot != pre-leg snapshot -> STOP, report restore failure; do NOT start the next leg"
    - "any write targets rowid 1 (DHCP/management row) -> FORBIDDEN, stop immediately"
    - "f6/f11 volatile on baselines -> STOP both legs, redesign"
    - "route linkage: none — census MISS, no leg budgeted, do not improvise one"
  prevalidation_offline:
    - { cmd: "/ip/vrf print", verdict: pass, write: false }
    - { cmd: "/ip/vrf/add name=m2ir-vrf interfaces=ether2", verdict: pass, write: true }
    - { cmd: "/ip/address/add address=198.51.100.10/24 interface=ether2 comment=m2ir-e2w", verdict: pass, write: true }
    - { cmd: "/ip/vrf/remove m2ir-vrf", verdict: pass, write: true }
    - note: "offline only; E2-W MUST re-run `centrs explain` on EVERY string (incl. set/remove with live selectors) before sending, and treat a rejection as data"
  restore_summary: "each leg removes its synthetic objects in reverse order (row before vrf) and verifies by snapshot equality; no reboot; ether2 ends addressless in main; DHCP row untouched throughout"
