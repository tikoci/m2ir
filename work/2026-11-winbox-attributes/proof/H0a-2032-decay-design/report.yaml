hypotheses_ranked_note: "ranked by prior support x cheap falsifiability. Each carries DISTINCT predictions; the three designs kill at least one each. Speculation lives HERE (report), never in fragment.yaml."
hypotheses_ranked:
  - id: H-decay-1-draining-gauge
    rank: 1
    name: "draining gauge / pending-work backlog"
    mechanism: "the add enqueues pending work (rule-compile/propagation/notify backlog); [20,32] reads the live backlog depth, which drains to zero as the device converges"
    prior: "G3's stated consistency (U-g3-32-mechanism); only hypothesis with any prior note"
    predicts:
      - "re-add re-spikes to ~same magnitude (each add enqueues ~same work) — design (a) confirms"
      - "decay is delay-dependent: ladder shows graded or step decay over tens of seconds, NOT instant — design (b) confirms"
      - "back-to-back t0 double-read stays nonzero (reads do not drain it) — design (b) R0a/R0b"
      - "no necessary coincidence with CMD_DISCONNECTED async (gauge is internal, not the notify fabric) — design (c) negative"
    killed_if: "re-add reads 0 with the rule present (a), or t0 double-read already 0 (b)"
  - id: H-decay-2-read-disturbance
    rank: 2
    name: "read-disturbance / observer effect"
    mechanism: "the GETCOUNT read itself consumes the value (first-reader-wins latch, counter-reset-on-read); decay is read-count-dependent, not time-dependent"
    prior: "none; cheapest to kill (one back-to-back read)"
    predicts:
      - "the SECOND native read after an add is already 0 no matter how fast it follows — design (b) R0a/R0b double-read decides"
      - "ladder shape is degenerate: nonzero exactly once per spike, all later rungs 0"
      - "G3's confirm reads were 0 because they were reads 2-3, not because a minute passed"
    killed_if: "any two consecutive reads both nonzero (b R0a+R0b), or re-read nonzero after a zero (flapping)"
  - id: H-decay-3-announce-backlog
    rank: 3
    name: "announcement-backlog counter"
    mechanism: "[20,32] counts queued-but-undelivered change announcements for the filter table; decay tracks the notify fabric draining"
    prior: "§45 REMOVE-always-announces proves a notify fabric exists; §42 pairs prove it is observable on-transport"
    predicts:
      - "CMD_DISCONNECTED pair traffic (or other async) is coincident with the decay window and QUIET after convergence — design (c) confirms"
      - "pair count / slot-ctr advance across the window scales with spike magnitude"
      - "decay on a churn-free persistent session is SLOWER or absent vs the session-per-read ladder"
    killed_if: "decay completes with zero async on a churn-free persistent session (c)"
  - id: H-decay-4-oneshot-newflag
    rank: 4
    name: "per-row one-shot new-flag"
    mechanism: "the value is a per-rowid new/unacked flag summed over recently added rows; each flag clears exactly once on the first post-add advertisement cycle"
    prior: "consistent with decay-to-zero and with dummy-invisibility (P-g1-dummy-invisible: device rows never flagged)"
    predicts:
      - "ladder shows a STEP function (1 then 0, no graded middle) regardless of rung density"
      - "re-add at a NEW rowid re-spikes; magnitude independent of session history"
      - "decay delay is roughly constant per add (one advertisement period), not proportional to magnitude"
    killed_if: "graded intermediate values on a dense ladder (b), or re-add at new rowid reads 0 (a)"
  - id: H-decay-5-session-churn
    rank: 5
    name: "session-churn artifact"
    mechanism: "the value reflects stale loader peer / zombie state created by WinBox session open/close churn — and EVERY leg-jump.ts read IS one open+close (openSession->login per harness/session.ts:30-42, close per leg-jump.ts:164). G3's three reads were three churn events; the decay may track churn count, not wall-clock"
