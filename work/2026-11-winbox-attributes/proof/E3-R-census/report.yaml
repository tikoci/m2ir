static-analysis:
  scope: "non-lab, no VM, no new disassembly; cite only what is already extracted in work/ + pinned hashes"
  pinned_binaries:
    - "RouterOS 7.25 x86 nova/bin/net sha256 4dfdc32ac9979b8ab86478dab601b79444875f936f7ff1b6b132553a565f6e7c (work/2026-10-chr-extraction/novabin-7.25.sha256)"
    - "v6 libumsg.so handleCmd @0x28508 (6.49.23) per net-bridge2-handler-tables.md section 1"
    - "NO recorded hash for libumsg7 itself (novabin-7.25.sha256 covers nova/bin only) and NO recorded v7 handleCmd address (blocker component)"
  narrowed:
    - "v7 Handler vtable shifts past slot 12: 13=cmdGetObj-overload, 14=cmdSetObj(u32), 15=cmdSetObj-overload, 16=cmdGetAll, 17=cmdStopGetAll, 18=cmdAddObj, 19=cmdRemoveObj(u32), 20=cmdRemoveObj-overload; slots 0-12 align with v6 (net-bridge2-handler-tables.md section 8)"
    - "v7 slot 19 is OCCUPIED by cmdRemoveObj, so the v6 model 'DEFAULT routes to slot 19 cmdUnknown' canNOT transfer unchanged to v7"
    - "v7 libumsg handleCmd jump-table bound is 0x1a (27 cases, cmds 0xfe0000-0xfe001a), vs v6 bound 0x16; case 0x14 (CMD_DISCONNECTED) calls *0x74 = slot 29 (findings section 42; std-commands.yaml dispatch-model)"
    - "schema std-command range ends at 0xfe0016: v7 JT cases 0x17-0x1a (cmds 0xfe0017-0xfe001a) are UNDECODED"
    - "v7 [20,0] slot 24 = LOCAL private-cmd switch 0x806885c (cmds 2..15, reads start/count): the per-handler local answer for net-0 only, NOT the base DEFAULT route (net-bridge2-handler-tables.md section 8)"
  exact_blocker: "v7 libumsg handleCmd DEFAULT-branch target slot + cases 0x17-0x1a meanings undecoded; needs an objdump/Ghidra pass over 7.25 x86 libumsg handleCmd (function address itself unrecorded) with a recorded binary hash; no live unknown-cmd probe exists on v7 (static-first recommended: unknown SYS_CMD effects are uncharacterized)"
e3-w-design:
  note: "DESIGN ONLY - zero writes executed in E3-R; all legs below need the user's fresh per-leg yes"
  counting_rule: "counted writes = control adds + native verbs + 1 per restore branch; per-leg cleanup removes are bundled (matches 7.25-nat-action 11+1=12 and 7.25-moveobj 2+1+1=4)"
  f40-same-hypotheses:
    - id: H-same-1
      claim: "action=same carries a distinct f40 u32 value V_same (discover by control add + native GETALL read-back)"
      controls: "same-not-by-dst=true variant (adjunct on/off must not move f40 if it rides its own field); to-addresses set (required arg?); to-ports + proto=tcp variant per the redirect precedent (bare redirect add failed until proto+to-ports were supplied)"
      discriminates: "V_same value; whether adjuncts share f40 or ride separate fields; minimal addable same-rule shape"
    - id: H-same-2
      claim: "same-not-by-dst rides its own bool field (not f40); to-addresses rides f1000/f1001 be32 pair; to-ports rides f1002/f1003 u32 pair (same numbering as proven for redirect/src-nat rows)"
      controls: "vary one adjunct at a time against a fixed same base; enumerate EVERY changed field per the plan (do not name the first changed TLV)"
      discriminates: "adjunct field identities; split-vs-shared representation"
    - id: H-same-negative
      claim: "if the control plane rejects a same add combination, the rejection (:parse/inspect text) is DATA about required args, not a failure to route around"
  jump-value-design:
    status: "BLOCKED on U1 (no filter handler to read); leg stays blocked with the exact next step in B1"
    contingent_design: "once W-filter-find names the hid: (1) control add chain=forward action=jump jump-target=<chain> + native GETALL -> jump f40-analog value + jump-target field identity; (2) control vary jump-target only -> which field moves; (3) native SETOBJ inverse write of the jump value + control read-back. Needs a follow-up cap (~3w): the 12w cap below covers filter-FIND only, not jump-value mapping"
  moveobj-ruled-out: "rowid-only MOVEOBJ answers ok but is a byte-identical no-op on BOTH surfaces (prior): rules out 'bare rowid moves to a default position' (no move-to-top/bottom either) and rules out status-ok as proof of reorder"
  moveobj-static-gate: "BEFORE burning native probes, decode what v7 net slot-17 (cmdMoveObj) reads besides 0xfe0001 (v6 case 0x28685 reads obj-id; v7 slot map past slot 20 incl. cmdMoveObj slot is undecoded) - non-lab, no budget; if static yields the field, probes target it directly"
  moveobj-hypotheses:
    - id: H-move-1-destination
      claim: "reorder needs a destination selector alongside 0xfe0001 (target rowid or place-before token)"
    - id: H-move-2-position
      claim: "reorder needs a position token in a pagination-adjacent field (0xfe0003 start/count family?)"
    - id: H-move-3-flags
      claim: "reorder needs a flag/verb-modifier field (0xfe000c flags-word family?)"
  moveobj-native-probes-max-2:
    - id: P-move-1
      shape: "MOVEOBJ {0xfe0001=rowid-B, 0xfe0003=rowid-A} (destination-as-start)"
      readback: "native GETALL order + control retrieve order must BOTH show B-before-A; else negative"
    - id: P-move-2
      shape: "MOVEOBJ {0xfe0001=rowid-B, 0xfe000c=<flags>} ONLY if the static gate suggests a flags word; else second probe = {0xfe0001=rowid-B, 0xfe0004=...} is FORBIDDEN (guessing) - instead spend probe 2 on the static-gate finding"
      readback: "same dual-surface order check; any ok-without-reorder repeats the rowid-only negative for that shape"
e3-w-leg-sheet:
  cap: "12 counted writes + 0 reboots (PROPOSED, NOT approved; needs fresh per-leg yes)"
  version_scope: "ws21/7.25 ONLY; beta4 repeat is a separate ask (no room in 12w)"
  named_vm: "ws21 (7.25); ports read from `quickchr list` at execution time, never hardcoded"
  baseline_snapshot: "control retrieve of /ip/firewall/{filter,nat,raw,mangle,calea} (expect 0 rows, record) + native GETALL/GETCOUNT on [20,5]/[20,87]/[20,39] + full [20,*] GETCOUNT sweep (this census is the baseline; re-run sweep legs at leg start to confirm no drift)"
  legs:
    - id: W-same-matrix
      budget: 5
      steps: "4 control adds (same base / +same-not-by-dst / +to-ports+proto / +to-addresses-only) each with native GETALL read-back + per-leg cleanup remove; final restore-verify (1)"
      stop: "any add rejected -> record :parse/inspect text, vary args ONCE per frozen candidate, then stop the variant (do not burn the matrix on one rejection)"
    - id: W-filter-find
      budget: 2
      steps: "1 control add (chain=forward action=accept comment=e3find) + sweep re-run (expect exactly one 0->1 slot) + remove + verify-all-zero (1)"
      stop: "zero flips -> filter hid NOT in [20,0..140], stop (do not widen: freeze stop-condition); more than one flip -> record all, stop (ambiguous, needs coordinator review)"
    - id: W-moveobj
      budget: 5
      steps: "static gate FIRST (no budget); then 2 control setup adds + up to 2 native MOVEOBJ probes (P-move-1, P-move-2-as-gated) each with dual-surface read-back + remove/restore-verify (1)"
      stop: "either probe reorders only one surface -> stop (split-brain, needs review); cleanup remove fails -> stop, VM stays for coordinator inspection"
  restore_step: "control remove per non-initial .id + control verify 0 rows on all five menus + native GETALL/GETCOUNT re-read; record restored true/false per branch (no fallback destroys the VM: E3-R created e3-beta4 but W legs run on ws21, which E3-R does not own for removal)"
  stop_conditions_global: ["any VM fails to boot within the bounded wait -> stop that leg", "any unbudgeted write attempted -> stop everything, report", "transport incomplete/truncated mid-leg -> stop the shard, record", "12th counted write spent -> stop even mid-matrix; remainder needs a new yes"]
