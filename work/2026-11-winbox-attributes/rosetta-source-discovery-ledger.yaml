# Hand-written ledger (NOT generated): records the repo-wide source-discovery
# pass for Rosetta/crosswalk/attribute candidates, with one disposition per
# row: candidate, rejected, or negative. Complements the generated plan-A
# outputs; it does not replace them and does not restate their counts.
#
# Scope: profiles/, physical/, concepts/, work/, fixtures/, test/,
# src/tooling/. Method: bounded literal/regex content search, then targeted
# reads; every row cites inspected file bodies (path:line), never bare
# search hits. Offline only: no network, no lab VMs touched.
