  0xfe0007:
    canonical-name: STD_DYNAMIC
    physical: { tcodes: [0x00, 0x01] }
    semantic: bool
    role: "row is dynamically created (not static config)"
    confidence: documented
    notes: "Proven live: true on the DHCP-created address row. First-party: co-occurs with 0xfe000a/0xfe0009 in row builders across net+bridge2 (33-40 sites each). Present only on some row types (bridge yes, ether/lo no)."
    evidence:
      - source: sample
        ref: "live CHR interrogation (WS-3C prober, 6.49.23 + 7.25), REST cross-checked; see work/2026-10-chr-extraction/ws3c-prober-findings.md §7"
      - source: code
        ref: "RouterOS net/bridge2 row builders (6.49.23); see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §2"

  0xfe0008:
    canonical-name: STD_INACTIVE
    physical: { tcodes: [0x00, 0x01] }
    semantic: bool
    role: "row is invalid (live-proven semantics; kept under the documented STD_INACTIVE name)"
    aliases:
      - { name: STD_INVALID, status: live-synonym, source: "WS-3C live experiment: address on a disabled bridge flips 0xfe0008 false->true" }
    confidence: documented
    notes: "Proven live as the invalid flag (REST cross-checked). Kept under Cisco-Talos's STD_INACTIVE label; whether INACTIVE and INVALID are one flag or two readings of it is unresolved."
    evidence:
      - source: sample
        ref: "live CHR interrogation (WS-3C prober, 6.49.23 + 7.25); see work/2026-10-chr-extraction/ws3c-prober-findings.md §7"

  0xfe0009:
    canonical-name: STD_DESCR
    physical: { tcodes: [0x20, 0x21] }
    semantic: utf8-string
    role: "row comment"
    confidence: documented
    notes: "First-party: session:9 comment = 0xfe0009/string, co-occurring with 0xfe0007/0xfe000a in row builders."

  0xfe000a:
    canonical-name: STD_DISABLED
    physical: { tcodes: [0x00, 0x01] }
    semantic: bool
    role: "row is administratively disabled"
    confidence: documented
    notes: "Proven live: disabling the bridge flips 0xfe000a false->true and running true->false (REST cross-checked). Presence drift: v6 omits the flag when false; v7 sends 0xfe000a=false. NOTE: absent from all 75 ops of the v6 interface row-core — disabled may arrive via a generic store-walk on that path."
    evidence:
      - source: sample
        ref: "live CHR interrogation (WS-3C prober, 6.49.23 + 7.25); see work/2026-10-chr-extraction/ws3c-prober-findings.md §7"
      - source: code
        ref: "RouterOS net interface row-core 0x80f6738 gap (6.49.23); see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §4"

  0xfe000b:
    canonical-name: STD_FINISHED
    physical: { tcodes: [0x00, 0x01] }
    semantic: bool
    confidence: documented
    notes: "Sighting: present as a bool on the live [24,24] updater reply (v7). Role beyond the documented label not yet decoded."

  0xfe000c:
    canonical-name: STD_FILTER
    physical: { tcodes: [0x28, 0x29] }
    semantic: nested-message
    confidence: documented
    notes: |
      Project-PROTOCOL.md identifies `FE000C` as STD_FILTER. CONFLICTING
      first-party + live readings as a u32 GETALL flags word: ConfigHandler
      reads flags = get<u32>(0xfe000c, default 5) for row assembly, and
      live values 0/5/0x20000000 return byte-identical replies (ignored
      for content on 6.49.23/7.25). The documented nested-message shape
      and the observed u32-flags shape are both recorded; which contexts
      use which is unresolved. As a SYS_CMD value 0xfe000c is CMD_SHUTDOWN
      (see std-commands.yaml) — namespaces overlap numerically.
    evidence:
      - source: code
        ref: "RouterOS libumsg.so ConfigHandler::cmdGetAll flags read (6.49.23); see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §1"
      - source: sample
        ref: "live CHR interrogation (WS-3C prober, 6.49.23 + 7.25): flags values ignored for content; see work/2026-10-chr-extraction/ws3c-prober-findings.md §8"

