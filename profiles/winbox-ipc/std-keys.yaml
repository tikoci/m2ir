    physical: { tcodes: [0x08, 0x09] }
    semantic: u32
    role: "TOTAL row count carried on replies (present even on SOME error replies — cursor-UNKNOWNID carries it, queue-3 census errors do not); doubles as the v7 GETCOUNT answer slot"
