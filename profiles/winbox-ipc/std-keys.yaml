# STD_* keys — winbox-ipc standard namespace (byte_2 = 0xFE)
#
# Object/session machinery: object IDs, paging, queries, dynamic flags.
# Drained from strawman/winbox-m2.ksy `full_key_id` enum (STD_* portion)
# and supplemented from winbox-m2-semantics.yaml notes.
---
m2ir-version: 0.1
schema-version: 0.1

profile: winbox-ipc
namespace: 0xfe
namespace-name: standard

source-table:
  name: typeIDCode
  language: lua
  file: Winbox_Dissector.lua
  lines: { from: 217, to: 244 }
  repo: "Cisco-Talos/Winbox_Protocol_Dissector"
  url: "https://github.com/Cisco-Talos/Winbox_Protocol_Dissector/blob/master/Winbox_Dissector.lua#L217-L244"
  drained-on: 2026-05-03
  notes: "STD_* portion of typeIDCode (0xFE0001–0xFE001B)."

evidence:
  - source: code
    ref: "Cisco-Talos Winbox_Dissector.lua:217-244 (typeIDCode STD_* portion)"
    url: "https://github.com/Cisco-Talos/Winbox_Protocol_Dissector/blob/master/Winbox_Dissector.lua#L217-L244"

keys:
  0xfe0001:
    canonical-name: STD_ID
    physical: { tcodes: ["*"] }
    semantic: object-id
    role: "object identifier for SETOBJ / REMOVEOBJ / GETOBJ; row-id on every list row (rendered *<hex> per CLI convention)"
    aliases:
      - { name: SESSION_ID, status: project-repurpose, source: "this project's mepty handler reuses STD_ID as session id from the auth phase" }
    confidence: documented
    notes: "Project's `SESSION_ID = 0xFE0001` is `STD_ID` repurposed by mepty. First-party: GETOBJ-family object id = get<u32>(msg, 0xfe0001); a missing id answers ERROR_UNKNOWNID."

  0xfe0002:
    canonical-name: STD_OBJS
    physical: { tcodes: [0xa8] }
    semantic: object-array
    role: "GETALL response envelope: message_array of flat per-row records"
    confidence: documented
    notes: "First-party: ConfigHandler::cmdGetAll builds 0xfe0002 = message_array[flat_row...] via per-item getMsg(iterator, flags, 0), with optional 0xfe001d first-row (flag-gated) and 0xfe0003 next-start-id when truncated past the 16KB cap."

  0xfe0003:
    canonical-name: STD_GETALLID
    physical: { tcodes: [0x08, 0x09] }
    semantic: u32
    role: "GETALL start cursor (request) / next-start token (truncated reply)"
    confidence: documented
    notes: |
      First-party: GETALL reads start = get<u32>(0xfe0003, default -1).
      Live pagination loop: bare (or count-limited) GETALL -> follow
      0xfe0003 tokens as the next start. Start semantics are PER-HANDLER
      and only server-issued tokens are meaningful: [20,1] validates
      start as an inclusive row-id cursor (0 or nonexistent -> UNKNOWNID
      error); [20,0] does NOT validate — start is lower_bound(row-id)
      in the by-id index, inclusive (nonexistent ids continue from the
      next-higher id, beyond-max returns empty), and iteration follows
      creation order rather than id order — which is why bare v7 order
      is ether1 (id 2) before lo (id 1) and the s=0..8 matrix fits no
      function of (id,s) alone. Next-token = row-id of the next
      un-emitted entry, so pagination stays sound. There is NO slot-14
      override on net-0: GETALL is routed by a slot-7 handleCmd
      dispatch override to a custom async worker.
    evidence:
      - source: code
        ref: "RouterOS libumsg.so ConfigHandler::cmdGetAll start/next-start handling (6.49.23); see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §1"
      - source: code
        ref: "RouterOS net [20,0] slot-7 dispatch 0x80d1af8 + worker 0x80d1040 + iterator 0x807763a lower_bound (6.49.23), v7 same shape (0x80682ec/0x8066774/0x8060306); see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §8"
      - source: sample
        ref: "live CHR interrogation (WS-3C prober, 6.49.23 + 7.25): count/next-token chaining + per-handler start matrix; see work/2026-10-chr-extraction/ws3c-prober-findings.md §8"
      - source: sample
        ref: "live CHR interrogation (post-WS-4 batch): lower_bound confirmed on demand both versions (v7 s=1->[lo]); see work/2026-10-chr-extraction/ws3c-prober-findings.md §15"
    revision-history:
      - date: 2026-10-31
        belief: "[20,0] start is an opaque cursor with no closed form (s=0..8 matrix fits nothing tried)"
        outcome: superseded
        evidence:
          - source: code
            ref: "RouterOS net [20,0] iterator lower_bound decode (6.49.23) fits the matrix given bridge id 5; see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §8"

  0xfe0004:
    canonical-name: STD_GETALLNO
    physical: { tcodes: [0x08, 0x09] }
    semantic: u32
    role: "GETALL count = head-limit on rows returned (request) / emitted-row count (v6 [20,0] reply echo)"
    confidence: documented
    notes: |
      First-party: count = get<u32>(0xfe0004), clamped to <= 1000. Live:
      count=N returns head-N + 0xfe0003 next-token when truncated;
      count=1 -> next=1 -> start=1 continues correctly over a 2-row
      table. Count=0 is VERSION-DIVIDED on [20,0]: v7 means zero rows
      (live 7.25 fixture + v7 worker static agree), v6 means ALL rows
      (v6 worker clamps count-1 > 999 back to 1000; live-proven:
      ev/6.49-getall-20-0-count0.json returns 1/1). Quirk: v7 count=0
      yields 0 rows PLUS a 0xfe0003 token pointing at the SECOND entry
      (ev/7.25-getall-20-0-count0.json) — following it skips the first
      row. The v6 [20,0] reply echoes 0xfe0004 = emitted-row count
      (live: 1 row -> 0xfe0004=1); v7 [20,0] drops that echo (neither
      0xfe0004 nor 0xfe0019 on the bare reply).
    evidence:
      - source: code
        ref: "RouterOS libumsg.so ConfigHandler::cmdGetAll count clamp (6.49.23); see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §1"
      - source: code
        ref: "RouterOS net [20,0] worker count handling: v6 0x80d1040 clamps (count-1 > 999) -> 1000, v7 0x80675bc clamps (count > 1000) -> 1000; see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §8"
      - source: sample
        ref: "live CHR interrogation (WS-3C prober, 6.49.23 + 7.25): chaining + v6 reply echo 0xfe0004=1 (ev/6.49-getall-20-0.json); see work/2026-10-chr-extraction/ws3c-prober-findings.md §8"
      - source: sample
        ref: "live CHR interrogation (post-WS-4 batch): v6 count=0->all + v7 count=0 token quirk; see work/2026-10-chr-extraction/ws3c-prober-findings.md §15"
    revision-history:
      - date: 2026-10-31
        belief: "count=0 empties the GETALL reply, unversioned"
        outcome: superseded
        evidence:
          - source: code
            ref: "RouterOS net [20,0] v6 worker maps count=0 -> 1000 while v7 maps it -> 0; see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §8"

