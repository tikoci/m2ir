  0xfe000c:
    canonical-name: STD_FILTER
    physical: { tcodes: [0x08, 0x09] }
    semantic: u32
    role: "GETALL flags word (default 5); per-handler selector word on GET paths"
    confidence: documented
    notes: |
      First-party: ConfigHandler reads flags = get<u32>(0xfe000c,
      default 5) for row assembly, and the [20,0] GETALL worker stores
      the word per version (v6 obj+0x1d8, v7 obj+0x220). Live GETALL
      legs: values 0/5/0x20000000 return byte-identical replies
      (ignored for content on 6.49.23/7.25); USER-namespace copies are
      ignored entirely. Per-handler SELECTOR use proven: [24,31] tests
      bit 28 (0x10000000) of a request 0xfe000c word to unfold the
      nested 0xfe0024 mode message (static getter + live differential:
      bare replies carry no 0xfe0024 on either version). Static-only
      second selector: the [24,1] getter reads get<u32>(0xfe000c) as a
      requested-field selector — never probed live, semantics open.
      As a SYS_CMD value 0xfe000c is CMD_SHUTDOWN (see
      std-commands.yaml) — namespaces overlap numerically.
      Wire (encoder-derived from physical/nv-message.yaml + the encU32
      magnitude rule; no tx capture committed): u32_compact (0x09) for
      values < 256 (e.g. flags 5 = `0c00fe09 05`), u32_wide (0x08)
      above (e.g. bit-28 leg = `0c00fe08 00000010`, matching the
      documented prober invocation `getone 24 31 --xfield
      16646156=268435456`); small values stay u32 (same compact/wide
      pairing as the 0xfe0001 row-id).
    evidence:
      - source: code
        ref: "RouterOS libumsg.so ConfigHandler::cmdGetAll flags read (6.49.23); see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §1"
      - source: code
        ref: "RouterOS net [20,0] GETALL worker flags store, both versions (v6 obj+0x1d8, v7 obj+0x220); see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §8"
      - source: code
        ref: "RouterOS v7 sys2 getter 0x805aaec ([24,31] bit-28 -> 0xfe0024) + [24,1] getter 0x8057f5c (get<u32> selector, static-only); see work/2026-10-chr-extraction/sys2-handler-tables.md"
      - source: sample
        ref: "live CHR interrogation (WS-3C prober, 6.49.23 + 7.25): flags values ignored for content; see work/2026-10-chr-extraction/ws3c-prober-findings.md §8"
      - source: sample
        ref: "live CHR interrogation (identity batch, 7.25): [24,31] bit-28 leg ev/7.25-getone-24-31-bit28.json vs bare ev/7.25-getone-24-31.json (no 0xfe0024 either version); see work/2026-10-chr-extraction/ws3c-prober-findings.md §18"
    revision-history:
      - date: 2026-11-01
        belief: "0xfe000c is a nested message (STD_FILTER), with a conflicting u32-flags reading of unknown context split"
        outcome: superseded
        evidence:
          - source: code
            ref: "four first-party get<u32>(0xfe000c) sites (cmdGetAll flags, [20,0] worker store, [24,1] selector, [24,31] bit-28 test); the nested label traces to a strawman type tag with no wire, code, or live citation"
          - source: sample
            ref: "live CHR interrogation: bit-28 differential proves an integer-word operand; no fixture/proof/transcript carries nested 0xfe000c"

