# ── session naming ────────────────────────────────────────────────────────
session-naming:
  role: |
    "SESSION" / "session namespace" in this project's older notes is loose
    naming for the 0xfe meta range (row-id, comment/disabled, envelope),
    NOT a distinct byte_2 value: no 0x02xxxx id exists in ANY RouterOS
    binary (byte-scan over nova/bin + lib, both versions). The wire
    namespaces are 0x00 (USER per-handler fields), 0x01 (NS-1: interface
    fields + private control plane), 0xfe (META/session), 0xff (SYS).
  confidence: observed-only
  evidence:
    - source: code
      ref: "RouterOS nova/bin + lib byte-scan, both versions; see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §2"

