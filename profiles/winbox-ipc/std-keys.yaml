# ── session naming ────────────────────────────────────────────────────────
session-naming:
  role: |
    "SESSION" / "session namespace" in this project's older notes is loose
    naming for the 0xfe meta range (row-id, comment/disabled, envelope),
    NOT a distinct byte_2 value: no 0x02xxxx id exists in ANY RouterOS
    binary (byte-scan over nova/bin + lib, both versions). The wire
    namespaces are 0x00 (USER per-handler fields), 0x01 (NS-1: interface
    fields + private control plane), 0xfe (META/session), 0xff (SYS).
  confidence: observed-only
  evidence:
    - source: code
      ref: "RouterOS nova/bin + lib byte-scan, both versions; see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §2"

investigation-trail:
  - date: 2026-10-31
    finding: |
      WS-4 drain of first-party grounding + live CHR interrogation:
      GETALL paging semantics on 0xfe0003 (per-handler start cursor) /
      0xfe0004 (head-limit count) / 0xfe0019 (total count); live proofs
      for 0xfe0007 dynamic / 0xfe0008 invalid / 0xfe000a disabled (+v7
      presence drift); mark-name role for 0xfe0010; GETCOUNT payload
      role for 0xfe0014; conflicting u32-flags reading on 0xfe000c;
      new entries 0xfe001c (tags) / 0xfe001d (first-row, never observed
      live); session-naming correction (no byte_2=0x02).
  - date: 2026-10-31
    finding: |
      Post-WS-4 static re-visit (net-bridge2 §8): [20,0] start is
      lower_bound(row-id), not opaque (0xfe0003 notes + history);
      count=0 version-divided on [20,0] and v6 reply echo
      0xfe0004 = emitted rows (0xfe0004 notes + history); nested
      0xfe001b second reading as the [20,0] id-ordered filtered
      GETALL switch (v6-static-only).
  - date: 2026-10-31
    finding: |
      Live verification batch (findings §15): v6 count=0->all
      proven (0xfe0004 notes), v7 count=0 token quirk recorded
      (0 rows + second-entry token), lower_bound start + 0x10001
      filter confirmed both versions.
