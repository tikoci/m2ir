    notes: "Live: present on [20,1] cursor-UNKNOWNID errors (=1); ABSENT on [20,0] (incl. the 306-row truncated replies) but present (=1) on [20,134] and on [20,1] (=1 all 3 versions) — handler-specific, not universal. Precision: 0xfe0019 is the GETALL total slot on EVERY version — only the GETCOUNT answer slot is version-divided (v6: 0xfe0014, v7: 0xfe0019; first live GETCOUNT evidence). Queue-3 refinement: 0xfe0019 (and 0xfe0014) ride NONE of the 26 census errors (BRKPATH/NOTIMP/UNKNOWNID/FAILED) — total-on-error is per-verb/per-handler: [20,1] cursor-UNKNOWNID carries 0xfe0019=1, while selector/verb-miss errors carry no total. The v7 GETCOUNT slot holds on [20,61]/[20,5]/[20,87]/[13,1]/[13,2]/[13,3]/[13,8] incl. ok + 0xFFFFFFFF on [20,61]. Queue-3 item 5: the v7 slot holds on 7.16.2/mipsbe real hardware ([20,61] GETCOUNT ok + 0xFFFFFFFF in 0xfe0019/0x8, 0xfe0014 absent) — below 7.25 and off x86/CHR."
