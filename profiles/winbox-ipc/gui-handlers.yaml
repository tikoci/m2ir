        ref: "RouterOS sys2 identity getter/setter (6.49.23); see work/2026-10-chr-extraction/sys2-handler-tables.md"
      - source: sample
        ref: "live CHR interrogation (WS-3C prober, 6.49.23 + 7.25): {12:name, 13:version} both versions; see work/2026-10-chr-extraction/ws3c-prober-findings.md §5"
    revision-history:
      - date: 2026-10-31
        belief: "identity is a single field 12"
        outcome: superseded
        evidence:
          - source: sample
            ref: "live CHR interrogation (WS-3C prober): field 13 = version on both versions; see work/2026-10-chr-extraction/ws3c-prober-findings.md §5"

  routerboard:
    sys-to: [24, 17]
    status: homeless
    process-id: 0x18
    process-ref: "./processes.yaml 0x18 (management)"
    cmd: GET_ONE
    role: "/system routerboard — model, serial, firmware (ATTRIBUTION SUSPECT)"
    confidence: observed-only
    fields:
      namespace: user
      map:
        1: { name: software-id, tcode: string }
        4: { name: nlevel, tcode: u32, role: "license level (also reachable via the license handler below)" }
        7: { name: current-firmware, tcode: string }
        9: { name: factory-firmware, tcode: string }
        10: { name: model, tcode: string }
        13: { name: serial-number, tcode: string }
        15: { name: upgrade-firmware, tcode: string }
        16: { name: routerboard, tcode: bool }
        24: { name: firmware-type, tcode: string }
        32: { name: board-name, tcode: string }
    notes: |
      Field 1 (software-id) and 4 (nlevel) are also read from the
      dedicated license handler below; this implementation queries only
      the license handler for those two and the routerboard handler for
      the rest, but both appear to expose overlapping fields.
      LIVE+STATIC WALL: [24,17] answers BRKPATH (from=[24] looper
      default) on BOTH 6.49.23 and 7.25; sys2 registers no handler 17
      (17-handler v6 census certain, both the addHandler sites and the
      live hscan; v7 census 19 sites, still no 17); no function in
      149 ELFs across both versions builds the RB row-shape (bool:16
      anchor + signature strings); sys2 handler 16 is
      /nova/store/chfont (console font), not an off-by-one RB.
      NARROWED: v6 rbbios ANSWERS direct queries ([61,1]={1:F},
      [61,2]={} — the handlers are live, only the sys2 relay is
      absent); v7 routes pid-61 to pid-1025 (quirk, open). But no
      reachable M2 path serves the full RB field ids (model/serial/
      firmware). The sys-to is version-drifted or wrong — kept as
      a suspect-shape record, NOT a working path.
    evidence:
      - source: sample
        ref: "live CHR interrogation (WS-3C prober, 6.49.23 + 7.25): BRKPATH both; full sys2 hscans clean; see work/2026-10-chr-extraction/ws3c-prober-findings.md §5"
      - source: code
        ref: "RouterOS 149-ELF row-shape sweep + rbbios last-mile analysis (both versions); see work/2026-10-chr-extraction/routerboard-hunt.md"
      - source: sample
        ref: "live CHR interrogation (census batch, both versions): v6 [61,1]/[61,2] answer, v7 61→1025 alias; see work/2026-10-chr-extraction/ws3c-prober-findings.md §17 + routerboard-hunt.md §8"
    open-questions:
      - "Where does the FULL /system/routerboard shape (model/serial/firmware) live over M2 on 6.49.23/7.25 — text-only via terminal, or a process not yet hunted?"
      - "Which version (if any) served the RB shape at [24,17]?"
      - "What is v7 pid 1025 (answers pid-61 requests; single NOTIMP handler 3)?"

  license:
    sys-to: [65]
    process-id: 0x41
    process-ref: "./processes.yaml 0x41 (new — not in Cisco-Talos typeIDCode)"
    cmd: GET_ONE
    role: "/system license"
    confidence: observed-only
    fields:
      namespace: user
      map:
        12: { name: nlevel, tcode: u8, role: "plausibly nlevel for CHR-free (value 0 here); UNCONFIRMED, no numeric level in REST to compare" }
        13: { name: software-id, tcode: string, role: "10-char system id, equals REST /system/license system-id exactly" }
    notes: |
      Single-element SYS_TO, like mepty's [76] — no handler-id suffix,
      answered from the process-65 looper default (no numbered handlers
      0-8 either version; keyman imports no addHandler). [65] GET_ALL ->
      NOTIMP (GET-only). Static: v6 keyman builder touches str
      {1,8,10,11,12,13} + u32:4, so a fuller row (incl. the old 1/4)
      may exist behind another selector — the bare-GET subset is {12,13}.
    evidence:
      - source: sample
        ref: "live CHR interrogation (WS-3C prober, 6.49.23 + 7.25): {12:u8 0, 13:software-id} both (ev/7.25-getone-65.json); see work/2026-10-chr-extraction/ws3c-prober-findings.md §6"
      - source: code
        ref: "RouterOS keyman builder 0x8050830 str/u32 touch-set (6.49.23); see work/2026-10-chr-extraction/routerboard-hunt.md §4"
    revision-history:
      - date: 2026-10-31
        belief: "license bare-GET is {1:software-id, 4:nlevel}"
        outcome: superseded
        evidence:
          - source: sample
