investigation-trail:
  - date: 2026-07-14
    finding: |
      Drained the GUI GET_ONE/GET_ALL management-handler surface from a
      private third-party WinBox client implementation. Confirms this
      project's existing legacy-short-form cmdGet=7 and the 0x0d/[13,4]
      path (now understood to double as a post-auth source-id exchange,
      not only the auth handler MarginResearch documented). Surfaces two
      new process ids (0x14, 0x41) and one direct conflict with the
      Cisco-Talos 0x10=dude assignment — recorded in processes.yaml rather
      than resolved here.
  - date: 2026-10-31
    finding: |
      WS-4 drain of first-party grounding (sys2-handler-tables.md,
      net-bridge2-handler-tables.md, routerboard-hunt.md) + live CHR
      interrogation (ws3c-prober-findings.md): source-id echo,
      GETALL paging rewrite (bare works, count/next-token, per-handler
      start), 14 new resource fields + field-45 rename candidate,
      identity field 13, routerboard homeless (BRKPATH both), license
      {12,13}, interface MTU triple + NS-1 + state-dependent rows,
      be32 IPv4, ipv6 extras, bridge-vlan {4,6}, and 12 newly
      identified / raw-recorded handlers ([24,0/8/24], [20,17/13/14],
      v7 net 107/114/115/122/125/126, unknowns [24,10/14/16/31],
      [13,5], [2,1]).
  - date: 2026-10-31
    finding: |
      Post-WS-4 static re-visit (net-bridge2 §8): [20,0] GETALL
      decoded — slot-7 handleCmd dispatch override (no slot-14
      override exists), start = lower_bound(row-id) with
      creation-order iteration, count=0 version-divided (v6 all /
      v7 none), v6 reply echo 0xfe0004 = emitted rows, v6-only
      0x10001/2/3/11/12 row filters (never live-observed).
  - date: 2026-10-31
    finding: |
      Live verification batch (findings §15, 13 new ev transcripts):
      v6 count=0->all proven, v7 start lower_bound confirmed on
      demand (s=1->[lo]), v7 count=1 token-only truncation, v7
      count=0 token quirk (points at second entry), 0x10001
      exact-match filter live both versions (ether 1, loopback 76).
      Mask-filter legs stay static-only.
