      WS-4 drain of first-party grounding (sys2-handler-tables.md,
      net-bridge2-handler-tables.md, routerboard-hunt.md) + live CHR
      interrogation (ws3c-prober-findings.md): source-id echo,
      GETALL paging rewrite (bare works, count/next-token, per-handler
      start), 14 new resource fields + field-45 rename candidate,
      identity field 13, routerboard homeless (BRKPATH both), license
