  interface:
    sys-to: [20, 0]
    process-id: 0x14
    process-ref: "./processes.yaml 0x14 (new — not in Cisco-Talos typeIDCode)"
    cmd: GET_ALL
    role: "/interface — one row per interface"
    confidence: observed-only
    fields:
      row-id: { namespace: session, field: 1 }
      namespace-1:
        1: { name: type-code, tcode: u32, role: "interface type code (ether 1, loopback 76); doubles as the 0x10001 exact-match GETALL filter leg (entry+0x60)" }
        2: { name: flags-a, tcode: u32, role: "entry+0x14 word (ether1 270947, lo 0 — stable across boots); doubles as the 0x10002/mask-0x10011 GETALL filter leg; bit 0x80 gates 0xfe0007 dynamic" }
        3: { name: flags-b, tcode: u32, role: "entry+0x1c word (ether1 542529, lo 525633 — stable across boots); doubles as the 0x10003/mask-0x10012 GETALL filter leg; bit 2 set = hidden/deleted (skipped by the bare default); bits 0x500 both set = running" }
        4: { name: kernel-ifindex, tcode: u32, role: "kernel interface index (entry+0x18 -> +0x28): lo=1, sequential per creation batch, gap at deleted interfaces, ABSENT on VRRP (no kernel device)" }
        5: { name: default-name, tcode: string }
        6: { name: name, tcode: string, role: "display name; the iteration-tree SECONDARY sort key (primary = u32 class at entry+0x20: type 1 ether -> 0, types 35/62 -> 1, else -> 2): every rename unconditionally unlinks + reinserts (full re-sort); creation sorted-inserts; R1-R4 dual-mode SUPERSEDED as mechanism (emergent shadow)" }
        14: { name: running, tcode: bool, role: "first-party: (entry+0x1c & 0x500) == 0x500" }
        30: { name: type, tcode: string }
        100: { name: mtu-config, tcode: u32, role: "configured MTU (0 = auto, arrives as u8; else u32)" }
        101: { name: l2mtu, tcode: u32, role: "KEEP-WITH-CAVEAT: seen ONLY as 65535 on an enabled v7 bridge; absent on ether/lo/vlan both versions; CHR virtio has no l2mtu in REST. Likely correct for hardware ether, unproven." }
        102: { name: unknown-102, tcode: u32, role: "v7: u32 written by type builders (0 on ether/vlan/bridge); v6: base row-core writes it as an EMPTY STRING. Producer moved base->type, type string->u32 across versions." }
        105: { name: actual-mtu, tcode: u32 }
      namespace-user:
        1001: { name: mac-address, tcode: bytes, size: 6 }
      namespace-session:
        7: { name: dynamic, tcode: bool, role: "base row-core: present-True if entry+0x14 bit 0x80 is set, else ABSENT (both versions). v7 bridge-type builder additionally writes explicit False (v6 bridge omits) — version drift in the TYPE builder, not the core." }
        9: { name: comment, tcode: string }
        10: { name: disabled, tcode: bool }
    evidence:
      - source: code
