      versions (s=0/999 -> 0xfe0004 + 0xfe0019=1; s=1 -> 1 row +
      0xfe0019=1; see the cursor fixtures above).
      GETOBJ: obj=1 returns a FLAT row (no 0xfe0002 wrapper) with
      the same field set as the GETALL row, per version; obj=999
      -> UNKNOWNID (0xfe0004) WITHOUT the 0xfe0019 total (differs
      from cursor errors, which carry it). All versions.
      GETCOUNT answers on [20,1] on all versions (count = 1 on the
      single-row lab tables): v6 replies 0xfe0014, 7.25+7.26beta4
      reply 0xfe0019 — first live GETCOUNT evidence (see
      std-keys.yaml 0xfe0014/0xfe0019 + std-commands.yaml
      CMD_GETCOUNT). Exact-match extras are IGNORED by both
      GETALL and GETCOUNT here (u32 f5/f1 match + non-match
      probes, 2 each per verb per version, all return the full
      row / count 1); whether any filter encoding works is
      UNKNOWN (STD_QUERY 0xfe0016 nested form untested).
      Extras 0x06/u8-0 + 0x0b/bool-F ride GETALL+GETOBJ rows on
      v7 only (both 7.x), absent on v6. E2-W legs (ws20 7.25,
      2026-11-02, 8w+0r) resolve f6 as the row VRF (0 on every
      main row across add/unset/disable/remove states, 1 on the
      stimulus-gated vrf=m2ir-vrf row; VRF creation without an
      address row moves no existing row — membership is per-row).
      f11 was UNKNOWN through E2-W (disabled ruled out: stayed
      false under disabled=yes; slave-prime untested, outside the
      frozen scope).
      F-f11 write leg (ws20 7.25, 2026-11-02, 6w+0r; `slave`
      unfrozen by the user for this promotion): static address on
      ether2 enslaved to a new bridge flips f11 false->true
      exactly with control slave=true (f6=0 throughout,
      dynamic/invalid/disabled all false on the flipped row);
      port removal flips both back (full symmetry). The
      not-enslaved DHCP row is byte-identical throughout
      (row-local flip, not table-wide). Confound recorded in
      the f11 role: enslavement also splits f5/f10 (4/3) on the
      test row; no split-without-slave state observed.
      Beta4 version-confirmation (winbox-beta4 7.26beta4 build
      2026-10-27, read-only, 2026-11-02): bare GETALL 1-row shape
      reproduces 7.25 bare-getall-reply EXACTLY (same 13-key row,
      wire order, tcodes, values incl. f6=0 on the vrf=main row;
      only the proxy banner differs); GETOBJ obj=1 flat row and
      obj=999 UNKNOWNID likewise reproduce. Second beta4 sample
      (independent VM/build from the queue-1 batch). The f6=1
      custom-VRF-row repeat is BLOCKED (VM carries only builtin
      main; needs a write leg) — no beta4 claim on nonzero f6.
      G4 write leg (g4beta5 7.26beta5, 2026-11-02, 10w+0r):
      f6=1 on the g4vrf address row (13-key shape shared with
      f6=0 rows) vs f6=0 on the main row — the beta-line
      f6-nonzero repeat (F1's beta4 f6=0 stands as the main-VRF
      sample). f5=actual / f10=configured cross-confirmed
      (enslavement splits 4/2 on the DHCP row; 3/3 where
      actual==configured). f11=slave mechanism reproduced (true
      on the enslaved-interface row, false on the free row).
