    notes: |
      Fields split across three byte_2 values: 0x01 (NS-1: interface
      fields + private control plane — the old `namespace-1` label is now
      identified), USER (0x00) for mac-address, SESSION (0xfe) for
      comment/disabled/dynamic. This 3-way split repeats across
      ip-address, bridge-port, and bridge-vlan, confirming NS-1 as a
      stable convention for this handler family. Row fields 0x10001/2/3
      double as the GETALL filter legs (see get-all-paging above) —
      the request keys and the row keys are the same numbers.
      Iteration ORDER is MECHANISM-SOLVED (both versions):
      the table is a tree ordered by (u32 class key at
      entry+0x20, name) — class 0 = type-1 ether, class 1 =
      types 35/62 (wlan/wlan60-, wireless-NPK overlay,
      CHR-absent), class 2 = everything else — and every
      rename unconditionally unlinks + reinserts (full
      re-sort); creation inserts sorted; reboot persists
      trivially (sorted order is the tree invariant).
      Name tie-break is byte-order strncmp
      (case-sensitive). The §19 R1–R4 dual-mode fixup is
      SUPERSEDED as mechanism: R2 pos0-freeze/one-short =
      class-0 singleton + class boundary, R3 = class-0
      multi, R4 day-0-NIC = ether count (no mode state
      exists). v6 [20,0] has no lo row. Only
      server-issued tokens chain soundly, which they do
      (306-row proof). Provider note: v7-ether (1) and
      v6-lo (76) typeobjs have no builder in net and no
      x3 entry — runtime/driver-provided (effective
      names 'ether'/'lo'); v6 lo is a type without an
      instance on CHR.
      Row shape is STATE-DEPENDENT: disabled rows are SLIM (computed
      fields 101/105/default-name/counters drop until re-enabled). MAC
      appears twice per row (0x3e9 always + a type-specific second field:
      0x404 on ether, 0x82 on bridge; equal values here). GETALL start
      on this handler is lower_bound(row-id), inclusive, with NO
      validation — nonexistent ids continue from the next-higher id
      (see get-all-paging above). This handler
      overrides handleCmd at slot 7 and serves GETALL from a custom
      async worker; its slots 9–17 are the NOTIMP base and are never
      reached for GETALL.
      Rows may carry 0xff001e (owner token) — ADD stores it,
      SET/REMOVE are gated by exact match, and tokened rows are
      boot-reaped by sstore (full lifecycle in sys-keys.yaml).
      M2 mutation contract (7.25): row-SET = slot-7 SETOBJ
      (0xfe0003) addressed by 0xfe0001=rowid — [20,0] CMD_SET
      is base-NOTIMP, and setone/0xfe000e is the singleton-attr
      path, not table-row SET. M2-ADD persists iff untokened
      (omit 0xff001e; untokened rows are first-class and
      CLI-removable). Vlan ADD keys: 0x10001=30 (type) +
      0x10006 (name) + 0x7d1 (vlan-id, required) + 0x7d2
      (parent ROW-ID — without it a parentless husk: f3=0,
      no ifindex, zero MACs).
      ADD-unhide is the apply-set merge itself (+0x1c :=
      old&0x500000 | msg.f3, a REPLACE for fresh rows) fed by
      the driver-reply f3 — no AND-clearer exists. REMOVE =
      force-0x82 block + apply + destroy-tail 0x806349e.
      Row-id lifecycle (7.25): the store record is u32 table +
      u32 rowid + u32 len + ("M2" + message); table 0 is the
      table→path directory (0x430 = net/devices); deletion is a
      len-0 tombstone record and the latest record per rowid wins.
      Tombstoned rowids stay RESERVED from auto-assign (which is
      high-water max+1, never reusing dead ids); an explicit-rowid
      ADD reclaims a tombstoned id but answers ERROR_EXISTS on a
      live one. The sstore daemon owns the /rw/store/cfg.%04x
      files: its GCCHECK compacts (latest-decisive copy-forward
      into max+1 generation, oldest chunk deleted) when junk
      (total−live bytes) exceeds 4096 with free ≥ 8×junk, on a
      minute-scale write-independent check (~5 min best-fit) —
      this rotation is what GCs tombstones and stale versions.
      E1 bridge/interface legs (disposable CHR, 7.25 + 6.49.23):
      f101=65535 confirmed live on the enabled v7 bridge row
      (ether/lo absent both versions); f30 census
      {ether,loopback,bridge,vrf} with per-row-type scope; 0x82
      second-MAC on bridge rows (0x404 ether/lo-only, absent
      on bridge rows); 0x01006a PROVEN as the VRF alias (e1br2
      main->e1vrf, control ether1 held); 0x010038 boot-fixed both
      versions (3 boots/3 value sets, flat intra-boot, NOT a
      fast counter, NOT uptime; writer unknown). The -4 pattern
      (0x01000c/0x2f/0x3a = 4294967292) is ether-only; bridge
      rows join lo at 0. One bridge row carries 0x000010 TWICE
      (u32 0 AND string '') — another shape-not-canonical data
      point. Per-row wire order is boot-stable (identical
      across all 3 in-session boots, both rows, pairwise) but
      differs from the older WS-3C capture (lo {1046,1002}
      swap) — mechanism unknown, with no wider claim. [20,0] rowids
      advance monotonically in-session (ether1=2/lo=1 stable
      incl. across reboot; bridge rowids 3,4,5,(6 unrecorded
      gap),7,8; vrf-interface rowid 9 is the id-space
      high-water) — unlike [16,2] port rowid 0, which IS reused
      across empty->add cycles (sstore-exception flag; see
      bridge-port). Follow-ups: W2 re-run for the vlan
      filtering=yes / move cells (budget 9; swap form + static
      MAC gate never live-tested), W5 retry for the host-table
      owner scan (budget 6).
