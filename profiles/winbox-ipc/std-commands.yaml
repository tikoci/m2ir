# ── dispatch model (first-party) ──────────────────────────────────────────
dispatch-model:
  role: |
    v6: nv::Handler::handleCmd subtracts 0xfe0000 and switches via a
    23-entry jump table; out-of-range SYS_CMD values (small integers,
    0x100xx, 0x60001, 0x70001 — see commands.yaml handler-private)
    fall to DEFAULT = slot 19 cmdUnknown(msg, cmd). Base
    cmdGet/cmdSet/cmdGetAll/cmdUnknown all answer errorMsg(0xfe0003)
    = ERROR_NOTIMP; a missing GETOBJ-family object id answers
    errorMsg(0xfe0004) = ERROR_UNKNOWNID. Command, error, and field
    namespaces overlap numerically (context-dependent) — e.g.
    0xfe000c is CMD_SHUTDOWN as a command but the GETALL flags word
    as a field.
    v7 (7.25 x86 lib/libumsg.so, sha256
    1d471df0c39e81b9ef946f636615e352470bd0da3fbeaf98fb017869b1c46c80):
    nv::Handler::handleCmd @0x374ec subtracts 0xfe0000 and bounds
    the jump table at 0x1a (27 cases, 0xfe0000-0xfe001a; table
    @0x735ec). The Handler vtable shifts past slot 12 (see
    slot-map-v7): 13=cmdGetObj-overload, 14=cmdSetObj(u32),
    15=cmdSetObj-overload, 16=cmdGetAll, 17=cmdStopGetAll,
    18=cmdAddObj, 19=cmdRemoveObj(u32) @0x33fe0,
    20=cmdRemoveObj-overload, 21=cmdMoveObj, 22=cmdGetCount,
    23=cmdRemoveBundle, 25=cmdShutdown, 26=shouldNotify,
    29=cmdDisconnected @0x3671a (slots 0-12 align with v6; slots
    27/28/30/31+ are R_386_RELATIVE local entries with zeroed
    addends = statically unresolvable). Case 0x14
    (CMD_DISCONNECTED) calls slot 29 (*0x74 @0x377b4). DEFAULT
    (out-of-range SYS_CMD incl. handler-private values, plus
    in-range 0x01/08/09/0a/0b/0f/10/11/19) routes to slot 24 =
    cmdUnknown @0x3406a (*0x60 @0x377e8) — the v6 "DEFAULT ->
    slot 19" model does NOT transfer. New-vs-v6 cases:
    0x17=cmdNotifyAck (direct), 0x18=cmdStopGetAll (slot 17),
    0x1a=cmdRemoveBundle (slot 23); 0x19 falls to DEFAULT. Base
    cmdRemoveObj/cmdUnknown answer errorMsg(0xfe0003) =
    ERROR_NOTIMP.
  slot-map:
    9: cmdGet
    10: cmdSet
    11: cmdReset
    12: cmdGetObj
    13: cmdSetObj
    14: cmdGetAll
    15: cmdAddObj
    16: cmdRemoveObj
    17: cmdMoveObj
    18: cmdGetCount
    19: cmdUnknown
    20: cmdShutdown
    24: cmdDisconnected
  slot-map-v7:
    9: cmdGet
    10: cmdSet
    11: cmdReset
    12: cmdGetObj
    13: cmdGetObj-overload
    14: cmdSetObj
    15: cmdSetObj-overload
    16: cmdGetAll
    17: cmdStopGetAll
    18: cmdAddObj
    19: cmdRemoveObj
    20: cmdRemoveObj-overload
    21: cmdMoveObj
    22: cmdGetCount
    23: cmdRemoveBundle
    24: cmdUnknown
    25: cmdShutdown
    26: shouldNotify
    29: cmdDisconnected
  confidence: observed-only
  evidence:
    - source: code
