# STD_CMD_* — winbox-ipc standard command codes
#
# When SYS_CMD (key 0xFF0007) carries a u32 value in the 0xFE0000 range,
# the value is one of these universal commands. Drained from
# strawman/winbox-m2.ksy `std_cmd` enum.
---
m2ir-version: 0.1
schema-version: 0.1

profile: winbox-ipc
appears-in: { field: 0xff0007, name: SYS_CMD }
range: { from: 0xfe0000, to: 0xfe0016 }

source-table:
  name: commandCode
  language: lua
  file: Winbox_Dissector.lua
  lines: { from: 149, to: 170 }
  repo: "Cisco-Talos/Winbox_Protocol_Dissector"
  url: "https://github.com/Cisco-Talos/Winbox_Protocol_Dissector/blob/master/Winbox_Dissector.lua#L149-L170"
  drained-on: 2026-05-03
  notes: |
    Every entry below is a verbatim transcription of the corresponding
    `commandCode` member with confidence `documented`. The Lua identifiers
    and hex values match exactly; no reinterpretation.

evidence:
  - source: code
    ref: "Cisco-Talos Winbox_Dissector.lua:149-170 (commandCode)"
    url: "https://github.com/Cisco-Talos/Winbox_Protocol_Dissector/blob/master/Winbox_Dissector.lua#L149-L170"

commands:
  0xfe0000: { canonical-name: CMD_NOOP,         confidence: documented }
  0xfe0001: { canonical-name: CMD_GETPOLICIES,  confidence: documented }
  0xfe0002:
    canonical-name: CMD_GETOBJ
    confidence: documented
    notes: |
      Object id rides 0xfe0001 (slot 12 + obj-id; missing -> ERROR_UNKNOWNID).
      Live verb matrix (7.25): [20,0] obj=row-id fetches ONE row;
      [24,2] obj=cpu-index returns sampler rows (cpu0/cpu1 on 1-vCPU CHR,
      obj>=2 UNKNOWNID); [24,34] obj=1 returns the security advisory
      (GETOBJ-only; bare GET stays UNKNOWNID); [20,61]/[13,6]/[13,7]
      answer NOTIMP (their GET selectors are NOT obj-id).
    evidence:
      - source: sample
        ref: "live CHR interrogation (identity batch, 7.25): ev/7.25-getobj-{24-34-1,24-2-0,24-2-1,20-0-2}.json; see work/2026-10-chr-extraction/ws3c-prober-findings.md §18"
  0xfe0003: { canonical-name: CMD_SETOBJ,       confidence: documented }
  0xfe0004: { canonical-name: CMD_GETALL,       confidence: documented }
  0xfe0005: { canonical-name: CMD_ADDOBJ,       confidence: documented }
  0xfe0006: { canonical-name: CMD_REMOVEOBJ,    confidence: documented }
  0xfe0007: { canonical-name: CMD_MOVEOBJ,      confidence: documented }
  0xfe0008: { canonical-name: CMD_SETFORM,      confidence: documented }
  0xfe0009:
    canonical-name: UNHANDLED_0x09
    confidence: observed-only
    notes: "genuinely unhandled: nv::Handler::handleCmd routes 0xfe0009 to the DEFAULT case (slot 19 cmdUnknown). No named command."
    evidence:
      - source: code
        ref: "RouterOS libumsg.so nv::Handler::handleCmd jump table (6.49.23); see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §1"
  0xfe000a:
    canonical-name: UNHANDLED_0x0a
    confidence: observed-only
    notes: "genuinely unhandled (same DEFAULT route as 0xfe0009). No named command."
    evidence:
      - source: code
        ref: "RouterOS libumsg.so nv::Handler::handleCmd jump table (6.49.23); see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §1"
  0xfe000b: { canonical-name: CMD_NOTIFY,       confidence: documented }
  0xfe000c:
    canonical-name: CMD_SHUTDOWN
    confidence: observed-only
    notes: "slot 20 = cmdShutdown (name from PLT symbols). WARNING: context-dependent — as a SYS_CMD value this is CMD_SHUTDOWN, but as a 0xfe-namespace FIELD (std-keys.yaml 0xfe000c) it is the GETALL flags word. Command/error/field namespaces overlap numerically."
    evidence:
      - source: code
        ref: "RouterOS libumsg.so nv::Handler::handleCmd case 0x28737 -> slot 20 (6.49.23); see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §1"
  0xfe000d:
    canonical-name: CMD_GET
    confidence: documented
    notes: |
      Project's `cmdGet=7` (a u8 SYS_CMD value, see commands.yaml) is a
      legacy short form used pre-mepty; it is distinct from
      CMD_GET=0xFE000D.
  0xfe000e: { canonical-name: CMD_SET,          confidence: documented }
  0xfe000f: { canonical-name: CMD_START,        confidence: documented }
  0xfe0010: { canonical-name: CMD_POLL,         confidence: documented }
  0xfe0011: { canonical-name: CMD_CANCEL,       confidence: documented }
  0xfe0012: { canonical-name: CMD_SUBSCRIBE,    confidence: documented }
  0xfe0013: { canonical-name: CMD_UNSUBSCRIBE,  confidence: documented }
  0xfe0014:
    canonical-name: CMD_DISCONNECTED
    confidence: documented
    notes: |
      Observed second use (§38): mproxy's unroutable-pid retry
      notify. One GET to a dead pid yields an endless ~1.42s
      PAIR, never an answer — (A) TO=[] FROM=[0xff0003,slot]
      and (B) TO=[] FROM=[2,slot] (policy -1), both carrying
      SYS_CMD=0xfe0014 with slot=(ctr<<8)|6 from a global
      counter. FROM[0]=0xff0003 is the looper-fabric pseudo-pid
      (§40: leg A = sendMessage's 0xff0003-branch output);
      the slots are not addressable (GET [2,slot]
      -> UNKNOWNID). Probes must match on SYS_REQID — unmatched
      reads misattribute these pairs. Distinct from the
      0xfe0014 FIELD in std-keys.yaml (GETCOUNT answer, other
      namespace). No 1420ms timer exists (mproxy: 100/6000/18000ms;
      loader: none) — the period is emergent (ping-pong
      hypothesis, sub-nano open).
    evidence:
      - source: sample
        ref: "live CHR interrogation (registry batch, 7.25): endless 1.42s retry pair on dead pids; see work/2026-10-chr-extraction/ws3c-prober-findings.md §38"
      - source: code
        ref: "RouterOS 7.25 libumsg/mproxy/loader retry-path decode (pushNotifies TO=[0xff0003], sendMessage 0xff0003 branch, leg-B worker, timer census); see work/2026-10-chr-extraction/ws3c-prober-findings.md §40"
  0xfe0015: { canonical-name: CMD_GETCOUNT,     confidence: documented }
  0xfe0016: { canonical-name: CMD_RESET,        confidence: documented }

# ── dispatch model (first-party) ──────────────────────────────────────────
dispatch-model:
  role: |
    nv::Handler::handleCmd subtracts 0xfe0000 and switches via a 23-entry
    jump table; out-of-range SYS_CMD values (small integers, 0x100xx,
    0x60001, 0x70001 — see commands.yaml handler-private) fall to
    DEFAULT = slot 19 cmdUnknown(msg, cmd). Base cmdGet/cmdSet/
    cmdGetAll/cmdUnknown all answer errorMsg(0xfe0003) = ERROR_NOTIMP;
    a missing GETOBJ-family object id answers errorMsg(0xfe0004) =
    ERROR_UNKNOWNID. Command, error, and field namespaces overlap
    numerically (context-dependent) — e.g. 0xfe000c is CMD_SHUTDOWN as
    a command but the GETALL flags word as a field.
  slot-map:
    9: cmdGet
    10: cmdSet
    11: cmdReset
    12: cmdGetObj
    13: cmdSetObj
    14: cmdGetAll
    15: cmdAddObj
    16: cmdRemoveObj
    17: cmdMoveObj
    18: cmdGetCount
    19: cmdUnknown
    20: cmdShutdown
    24: cmdDisconnected
  confidence: observed-only
  evidence:
    - source: code
      ref: "RouterOS libumsg.so nv::Handler::handleCmd + ConfigHandler::cmdGetAll (6.49.23); see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §1"

investigation-trail:
  - date: 2026-10-31
    finding: |
      WS-4 drain of first-party grounding
      (net-bridge2-handler-tables.md §1): added CMD_SHUTDOWN (0xfe000c,
      previously a schema gap) + UNHANDLED markers for 0xfe0009/0xfe000a
      (previously gaps of unknown status), and the dispatch/slot model
      with the base-NOTIMP + missing-id-UNKNOWNID error rules.
