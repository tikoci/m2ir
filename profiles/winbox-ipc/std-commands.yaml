        ref: "live CHR interrogation (persistence batch, 7.25): raw slot-7 SETOBJ + 0xfe0001=rowid; see work/2026-10-chr-extraction/ws3c-prober-findings.md §31"
      - source: sample
        ref: "live CHR interrogation (phase-C pilot slice 2, 7.25, 2026-11-02): [20,1] SETOBJ + read-back — fixtures/winbox-ipc/7.25-verbs-20-1-ip.json"
      - source: sample
