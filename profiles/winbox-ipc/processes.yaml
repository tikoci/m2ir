  - version-range: "6.30.1-6.42.x"
    source: "Tenable CVE-2018-14847 PoC"
    mappings:
      - { binary: /nova/bin/mproxy, process-id: 0x02, handler-id: 2 }
    notes: "The public PoC sends WinBox file-open and file-read messages to [2,2]."
  - version-family: "RouterOS v6 (DEVCORE auth trace)"
    source: "DEVCORE Pwn2Own Toronto 2022"
    mappings:
      - { binary: /nova/bin/user, process-id: 0x0d, handler-id: 4, role: "account/password verification handler" }
    notes: |
      DEVCORE's auth walkthrough uses `SYS_TO=[13,4]` for the `user`
      authentication handler. Treat this as another version-scoped
      corroboration of the `/nova/bin/user` -> 13 mapping, not as a
      universal claim about all RouterOS releases.
  - version: "6.49.23"
    source: "nova/etc/loader/system.x3 + bndl/*/loader/*.x3 + dude.x3 (91 entries, tag=30 records: attr 7 = path, attr 4 = process id)"
    mappings:
      - { binary: /nova/bin/mproxy, process-id: 0x02 }
      - { binary: /nova/bin/discover, process-id: 0x0a }
      - { binary: /nova/bin/user, process-id: 0x0d }
      - { binary: /nova/bin/bridge2, process-id: 0x10 }
      - { binary: /nova/bin/net, process-id: 0x14, x3-name: interface }
      - { binary: /nova/bin/sys2, process-id: 0x18, x3-name: management }
      - { binary: /nova/bin/cerm, process-id: 0x13 }
      - { binary: /nova/bin/radv, process-id: 0x1f }
      - { binary: /nova/bin/route, process-id: 0x2c }
      - { binary: /nova/bin/rbbios, process-id: 0x3d }
      - { binary: /nova/bin/keyman, process-id: 0x41, x3-name: license }
      - { binary: /nova/bin/mepty, process-id: 0x4c }
      - { binary: /nova/bin/dude, process-id: 0x67 }
      - { binary: /nova/bin/quickset, process-id: 0x78 }
    notes: "Key resolutions: 0x10 = bridge2 (dude = 103, resolving the Cisco-Talos conflict for this version); mepty = 76; user = 13 stable since 6.43.45; [120] = quickset (resolves the session/login-handler claim). Two pathless records (56=[24,23], 56=[20,50]) adjacent to net/www unresolved (reserved? package-conditional?). 29 map entries have no on-disk binary (uncached package NPKs + partd/msgfw/vm/cloudpingd)."
    evidence:
      - source: code
        ref: "RouterOS 6.49.23 .x3 process map (process-map-6.49.23.json); see work/2026-10-chr-extraction/README.md"
  - version: "7.25"
    source: "DEFERRED — no static source found (no loader.x3/starter.x3; loader/sermgr/sysinit carry no id tables; v7 loader spawns /nova/bin/* via fork/execl)"
    mappings: []
    notes: "v7 ids are likely assigned at boot/install (readdir/spawn order?) — recoverable only live (hscan) or by deep per-binary RE. DO NOT assume v6 ids hold on v7. Live hscans confirm the interrogated paths ([24,x], [20,x], [16,x], [13,x], [65], [10,x], [2,x], [76]) answer on the same numbers on 7.25, but that is a sampled confirmation, not a full map."

