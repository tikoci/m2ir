# RouterOS process / handler IDs — winbox-ipc
#
# The first u32 element of SYS_TO and SYS_FROM (key 0xFF0001/0xFF0002,
# tcode 0x88) is a process_id; subsequent elements are the handler
# hierarchy *within* that process. The same byte also forms the top byte
# of handler-private SYS_CMD values (e.g. 0x0A0065 -> process 0x0A,
# handler-local opcode 0x0065).
#
# Drained from Cisco-Talos `typeIDCode` (catch-all entries at lines
# 246-269 of Winbox_Dissector.lua, used as "if no full SYS/STD match,
# compare value & 0xFF0000"). Project-observed entries that don't appear
# in Cisco-Talos are recorded with confidence: observed-only.
---
m2ir-version: 0.1
schema-version: 0.1

profile: winbox-ipc
appears-in:
  - { field: 0xff0001, name: SYS_TO,   element-index: 0 }
  - { field: 0xff0002, name: SYS_FROM, element-index: 0 }
  - { field: 0xff0007, name: SYS_CMD,  byte: top-byte-of-u32 }

source-table:
  name: typeIDCode
  language: lua
  file: Winbox_Dissector.lua
  lines: { from: 246, to: 269 }
  repo: "Cisco-Talos/Winbox_Protocol_Dissector"
  url: "https://github.com/Cisco-Talos/Winbox_Protocol_Dissector/blob/master/Winbox_Dissector.lua#L246-L269"
  drained-on: 2026-05-03
  notes: |
    The catch-all section of `typeIDCode`. Each entry is a u32 of the
    form `0xPP0000`; the dissector matches `value & 0xFF0000` after the
    full SYS_*/STD_* lookup misses. The `0xPP` byte is the process id
    used in the first element of SYS_TO / SYS_FROM and as the top byte
    of handler-private SYS_CMD values.
  version-warning: |
    Process ids are assigned by `/nova/etc/loader/system.x3` and differ
    across RouterOS versions. Keep the Cisco-Talos table as a documented
    reference version, but do not treat its numeric process ids as a
    universal map.

evidence:
  - source: code
    ref: "Cisco-Talos Winbox_Dissector.lua:246-269 (typeIDCode process catch-alls)"
    url: "https://github.com/Cisco-Talos/Winbox_Protocol_Dissector/blob/master/Winbox_Dissector.lua#L246-L269"
  - source: code
    ref: "tenable/routeros msg_re/parse_x3 (system.x3 examples)"
    url: "https://github.com/tenable/routeros/blob/master/msg_re/parse_x3/README.md"
  - source: code
    ref: "tenable/routeros msg_re/find_handlers (registered handlers)"
    url: "https://github.com/tenable/routeros/blob/master/msg_re/find_handlers/README.md"
  - source: doc
    ref: "MarginResearch — Pulling MikroTik into the Limelight"
    url: "https://margin.re/2022/06/pulling-mikrotik-into-the-limelight/"
  - source: doc
    ref: "DEVCORE — Pwn2Own Toronto 2022"
    url: "https://devco.re/blog/2024/05/24/pwn2own-toronto-2022-a-9-year-old-bug-in-mikrotik-routeros-en/"
  - source: code
    ref: "private third-party WinBox client implementation (server-side monitoring product; source not publicly available) — see ./gui-handlers.yaml for the full handler catalog this sources"

version-observations:
  - version: "6.43.45"
    source: "/nova/etc/loader/system.x3 parsed by Tenable parse_x3"
    mappings:
      - { binary: /nova/bin/log, process-id: 0x03 }
      - { binary: /nova/bin/radius, process-id: 0x05 }
      - { binary: /nova/bin/moduler, process-id: 0x06 }
      - { binary: /nova/bin/user, process-id: 0x0d }
    notes: "Concrete example showing that process ids are loader-assigned and version-scoped."
  - version-range: "6.30.1-6.42.x"
    source: "Tenable CVE-2018-14847 PoC"
    mappings:
      - { binary: /nova/bin/mproxy, process-id: 0x02, handler-id: 2 }
    notes: "The public PoC sends WinBox file-open and file-read messages to [2,2]."
  - version-family: "RouterOS v6 (DEVCORE auth trace)"
    source: "DEVCORE Pwn2Own Toronto 2022"
    mappings:
      - { binary: /nova/bin/user, process-id: 0x0d, handler-id: 4, role: "account/password verification handler" }
    notes: |
      DEVCORE's auth walkthrough uses `SYS_TO=[13,4]` for the `user`
      authentication handler. Treat this as another version-scoped
      corroboration of the `/nova/bin/user` -> 13 mapping, not as a
      universal claim about all RouterOS releases.

transient-process-observations:
  - binary: /nova/bin/login
    id-shape: runtime-serial
    confidence: documented
    source: "DEVCORE Pwn2Own Toronto 2022"
    notes: |
      DEVCORE uses process id 1039 for `login` in its illustrative auth
      trace and explicitly notes that this kind of helper process is spawned
      on demand and absent from the `.x3` files.

registered-handler-observations:
  - binary: /nova/bin/mproxy
    version: "6.41.4"
    handler-ids: [2, 1]
    confidence: documented
  - binary: /nova/bin/user
    version: "6.41.4"
    handler-ids: [3, 2, 1, 4, 5, 6, 7, 8]
    confidence: documented
    notes: "MarginResearch's auth trace reaches the user authentication handler at [13,4]."
  - binary: /nova/bin/www
    version: "6.41.4"
    handler-ids: [1, 2]
    confidence: documented
    notes: "MarginResearch identifies handler 2 as FoisHandler."

processes:
  0x01: { canonical-name: net,      confidence: documented }
  0x02:
    canonical-name: moduler
    confidence: documented
    notes: |
      Cisco-Talos labels 0x02 as `moduler` in its reference version. This
      slot is version-scoped: Tenable's CVE-2018-14847 PoC uses [2,2] as
      the `mproxy` file-transfer handler for RouterOS 6.30.1-6.42.x, while
      Tenable's parse_x3 sample for 6.43.45 moves `/nova/bin/moduler` to
      process id 0x06.
    version-identities:
      - version-source: "Cisco-Talos reference version"
        canonical-name: moduler
        confidence: documented
      - version-range: "6.30.1-6.42.x"
        canonical-name: mproxy
        confidence: documented
        evidence:
          - source: code
            ref: "tenable/routeros poc/bytheway (set_to(2,2))"
            url: "https://github.com/tenable/routeros/blob/master/poc/bytheway/src/main.cpp"
  0x03: { canonical-name: sermgr,   confidence: documented }
  0x04: { canonical-name: notify,   confidence: documented }
  0x05: { canonical-name: radv,     confidence: documented }
  0x06: { canonical-name: system,   confidence: documented }
  0x07: { canonical-name: ping,     confidence: documented }
  0x08:
    canonical-name: undo
    confidence: documented
    notes: |
      Cisco-Talos labels 0x08 as `undo` in its reference version. Tenable's
      6.41.4 handler survey does not show a standalone `/nova/bin/undo`
      binary, so treat this as a version-specific identity rather than a
      universal guarantee of a dedicated undo daemon.
  0x09: { canonical-name: log,      confidence: documented }
  0x0a:
    canonical-name: mepty
    confidence: documented
    notes: "Terminal PTY proxy. Owns commands 0x0A0065 (login) and 0x0A0067 (data) per this project."
  0x0b: { canonical-name: pppman,   confidence: documented }
  0x0c: { canonical-name: radius,   confidence: documented }
  0x0d:
    canonical-name: hotplug
    confidence: documented
    notes: |
      Cisco-Talos labels 0x0D0000 as `hotplug` in its reference version.
      MarginResearch and Tenable's parse_x3 sample for RouterOS 6.43.45
      both place `/nova/bin/user` at process id 13 (0x0d), and
      MarginResearch's authentication trace uses [13,4] to reach the user
      authentication handler. Treat this numeric slot as version-scoped.
    version-identities:
      - version-source: "Cisco-Talos reference version"
        canonical-name: hotplug
        confidence: documented
      - version: "6.43.45"
        canonical-name: user
        confidence: documented
        notes: "MarginResearch's auth trace uses [13,4]; Tenable parse_x3 maps `/nova/bin/user` -> 13."
    revision-history:
      - date: 2026-05-03
        belief: "0x0D = user-service-or-similar (project observation [13,4]; loose attribution to MarginResearch)"
        outcome: superseded
        evidence:
          - source: doc
            ref: "winbox-m2-semantics.yaml processes.0x0d in strawman/"
      - date: 2026-05-03
        belief: "0x0D = hotplug; [13, 4] is hotplug subhandler 4"
        outcome: superseded
        evidence:
          - source: code
            ref: "Cisco-Talos Winbox_Dissector.lua:258 (HOTPLUG = 0X0d0000)"
            url: "https://github.com/Cisco-Talos/Winbox_Protocol_Dissector/blob/master/Winbox_Dissector.lua#L258"
      - date: 2026-05-04
        belief: "0x0D is version-scoped: hotplug in the Cisco-Talos reference version, user in 6.43.45's system.x3/auth traces"
        outcome: current
        evidence:
          - source: doc
            ref: "MarginResearch — [13,4] authentication path to user"
            url: "https://margin.re/2022/06/pulling-mikrotik-into-the-limelight/"
          - source: code
            ref: "tenable/routeros msg_re/parse_x3 — /nova/bin/user -> 13"
            url: "https://github.com/tenable/routeros/blob/master/msg_re/parse_x3/README.md"
    open-questions:
      - "Which RouterOS build produced Cisco-Talos's HOTPLUG = 0x0D label?"
      - "When did `/nova/bin/user` occupy process id 13, and what process id did hotplug move to in those builds?"
      - |
        A private third-party WinBox client implementation also sends a
        GET (cmdGet=7) to [13,4] once per connection, immediately after
        auth completes, purely to read back a server-assigned source id
        from the reply's SYS_FROM — see ./gui-handlers.yaml
        source-id-adoption. Is this the same `user` handler MarginResearch
        traces for authentication doing double duty as a capability
        exchange, or a distinct handler that happens to share the path?
  0x0e: { canonical-name: bridge,   confidence: documented }
  0x0f: { canonical-name: diskd,    confidence: documented }
  0x10:
    canonical-name: dude
    confidence: documented
    notes: |
      CONFLICT: a private third-party WinBox client implementation queries
      [16,2] and [16,13] for /interface bridge port and /interface bridge
      vlan respectively (see ./gui-handlers.yaml bridge-port / bridge-vlan).
      Either process 0x10 is version-scoped like 0x02 (moduler/mproxy) and
      0x0d (hotplug/user) above — dude in the Cisco-Talos reference
      version, a bridge-management handler in whatever version that
      implementation targets — or [16,2]/[16,13] are wrongly attributed in
      that source. Not resolved; do not assume either identity is
      universal.
    evidence:
      - source: code
        ref: "private third-party WinBox client implementation (server-side monitoring product; source not publicly available)"
    open-questions:
      - "Does RouterOS reassign 0x10 from dude to a bridge-management role in some version range, matching the 0x02 and 0x0d precedents?"
      - "Or does the third-party implementation's [16,2]/[16,13] path route through dude's own handler surface (dude managing bridge state) rather than a distinct bridge process?"
  0x11: { canonical-name: console,  confidence: documented }
  0x12: { canonical-name: cerm,     confidence: documented }
  0x14:
    canonical-name: interface
    confidence: observed-only
    notes: |
      Not in Cisco-Talos typeIDCode. A private third-party WinBox client
      implementation queries [20,0] (/interface), [20,1] (/ip address),
      and [20,37] (/ipv6 address) — see ./gui-handlers.yaml. Named
      `interface` here descriptively; no independent source confirms this
      label.
    evidence:
      - source: code
        ref: "private third-party WinBox client implementation (server-side monitoring product; source not publicly available)"
  0x18:
    canonical-name: management
    confidence: observed-only
    notes: |
      Project observes paths [24,0], [24,1], [24,2]. Not in Cisco-Talos
      typeIDCode. Corroborated and extended by a private third-party
      implementation, which also uses [24,1] (/system identity), [24,2]
      (/system resource), and [24,17] (/system routerboard) — see
      ./gui-handlers.yaml.
    evidence:
      - source: code
        ref: "private third-party WinBox client implementation (server-side monitoring product; source not publicly available)"
  0x41:
    canonical-name: license
    confidence: observed-only
    notes: |
      Not in Cisco-Talos typeIDCode. A private third-party WinBox client
      implementation addresses it as a bare single-element SYS_TO=[65]
      (like mepty's [76]), for /system license — see ./gui-handlers.yaml.
    evidence:
      - source: code
        ref: "private third-party WinBox client implementation (server-side monitoring product; source not publicly available)"
  0x2c: { canonical-name: route,    confidence: documented }
  0x4c:
    canonical-name: mepty-handler-0x4c
    confidence: observed-only
    notes: |
      Project uses [76] as the mepty handler path. Inconsistent with
      process_id=0x0a; likely [76] is a *handler id* under the mepty
      process rather than a process id itself. Not in Cisco-Talos
      typeIDCode. A private third-party implementation corroborates the
      bare single-element SYS_TO=[76] path for mepty login/data messages,
      while its SYS_CMD values for those same messages are 0x0A0065 /
      0x0A0067 (top byte 0x0a) — see ./commands.yaml handler-private. The
      path (0x4c) and the command top-byte (0x0a) disagree on which
      number is "the" mepty process id; this project has not resolved
      which one (if either) loader/system.x3 actually assigns to mepty.
    evidence:
      - source: code
        ref: "private third-party WinBox client implementation (server-side monitoring product; source not publicly available)"
    open-questions:
      - "Is [76] a handler under process 0x0a (mepty) or its own process?"
      - "Why does the command-code top byte (0x0a) not match the SYS_TO path (0x4c/76) for the same mepty login/data messages?"
  0x78:
    canonical-name: login-or-mgmt
    confidence: observed-only
    notes: "Project uses [120] as 'session/login handler'. Not in Cisco-Talos typeIDCode."
  0xfd:
    canonical-name: local
    confidence: documented
    notes: "Reserved for local/loopback dispatch."
  0xfe:
    canonical-name: standard_ns
    confidence: documented
    notes: "Synthetic process id matching the standard namespace byte."
  0xff:
    canonical-name: system_ns
    confidence: documented
    notes: "Synthetic process id matching the system namespace byte."

investigation-trail:
  - date: 2026-07-14
    finding: |
      Added two new process ids (0x14 interface-family, 0x41 license) and
      one direct conflict (0x10: documented as `dude` by Cisco-Talos, but
      a private third-party implementation uses [16,2]/[16,13] for bridge
      port/vlan) from a private third-party WinBox client implementation.
      Also added a source-id-adoption note to 0x0d/[13,4] and a path-vs-
      command-code-top-byte discrepancy note to 0x4c/mepty. See
      ./gui-handlers.yaml for the full handler catalog this drains from.
