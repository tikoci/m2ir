handler-info-registry:
  role: |
    v7 process/handler identity is compiled into every binary via
    libumsg `handler_info` — there is no config file to read. PR table:
    138 entries @0x7BB00, stride 0x1c (name, pid@+0x8, pkg@+0xc,
    flags@+0x10/+0x14), pids 2-172 (148 is triple-booked test entries).
    HD table: 296 entries @0x77EE0, stride 0x34 (owner-PR-ptr@+0x0, two
    names, id2@+0x20 = ((pid+1)<<24)|((hid+1)<<16)|flags) = menu/store
    bindings (98 menus; `cert/settings` = [19,13] calibration exact).
    pkg@+0xc indexes a package table (0x10 stride: 0=system …
    19=ppp, 22=security; each PR's pkg points at its package's
    entry). PRinf::isSuppressed = !rosMode.hasFeature(pkg-id)
    (libumsg 0x61c24; HDinf delegates to owner PR) — suppression
    is DYNAMIC per-package gating evaluated at boot. Thesis: pid
    identity is compiled in; compat (aliases/shims/stubs) is pure
    boot-time router state, not a table.
  alias-table:
    verdict: "NO static alias/shim table exists (exhaustive negative)"
    searched: "loader .text/.rodata (no pid literals/names), all v7 x3 (no loader dir), mproxy (hids {1,2}, no fork, no 0x400+ refs), PR (no 102x, no alias field), HD (no shim rows; client pids 12/61/75/89 have ZERO rows), family binaries (no shim-pid immediates/fork), kernel image (stripped, unproductive)"
    conclusion: |
      Routing = loader dynamic peer-tree (plain pid find, no rewrite
      step) + mproxy retry (see std-commands.yaml 0xfe0014). Aliases,
      shims and stub entries are boot-time router state, complete
      before the first M2 reply (boot-race: 38/38 rounds identical).
      Insertion agent CLOSED (§41): LOADER-RULE — shim order =
      PR encounter order (PR[30] < PR[34] < PR[45] < PR[93],
      re-decoded at the true base §43), zero claimant
      machinery after false-positive elimination
      (HashImpl/L2TP/OpenVPN/IKE/X.509 vocab, unaligned u32
      accidents). Self-registration REFUTED (ssld owns
      handlerless 1027 with no claimant). Aliases AND stubs
      are loader peer-tree ROUTES ([1024+i,h]→[parent,h]),
      not registrations. The §38 flags-descending 4/4 is
      coincidence (45 non-shim pids ≥ shim-min f10). §41
      site-(2) REFUTED (§43): the five 0x400 sites are
      fd-close loops, an M2 field-id insert, and crypto
      lengths — no pid-table builder. Insertion MECHANISM
      bounded (§43): compat-pid allocator = AddEvent
      handler 0x8054286 (pid-less nodes get smallest-free
      pid ≥ +0xd8, init 0x400, wrap 0x10000→0x400; links
      into the +0xbc pid-map), posted via 0x8051366.
      UNIFICATION (§44): workers ARE the shims — they never
      die, they run as the shim loopers under compat pids.
      TRIGGER = worker-spawn posts: the Peers-loop spawn
      loop (0x8053bec) posts one pid-less node per worker
      for exactly the 4 multiplepeer PRs {89,61,75,12}
      (percpu 80/50/50/400; N = sysconf×percpu/100),
      AddEvent assigns 0x400+i in post order (confirmed
      live: aliases answer from 0x400-403 in order).
      ABSENCE dissolved: each servant strstr-branches on
      argv0 "X-worker" (ppp 0x80932fd, ipsec 0x8059ee6,
      cerm 0x805f3ae) and the worker branch runs its
      looper (no death; the §41 pkg-19 puzzle dissolves —
      both master and worker are alive). STUBS = the
      worker branches' registrations, exactly: ppp
      {14,21,31,51,61}, ipsec {3}, cerm {8}, ssld {}
      (v6 identical: cerm-worker branch registers {8}).
      v6 already has the compat block (89→1024,
      75→1025, 12→1026, 1027 spare); v7 inserts
      ipsec-worker at 1025. SPARE identity CLOSED
      (§45): unix-accept connection peers on
      /ram/novasock (pid-less via ctor 0x8050ff4;
      0x404-406 = the 3 surviving worker
      connects; ssld's 4th accept is removed).
      Count: 4 spawn + 4 accept - 1 removed = 7
      linked (tree-self is preset pid 1; aliases
      and singletons are preset). ALIAS mechanism
      CLOSED (§45): preset node (+4=PR pid) with
      a "multiple(" worker-vector forward (VT
      0x805affc). REMOVE always announces (both
      REMOVE posters build policy-1 + 0xfe0014
      first). Serial carries login prompt only.
      Vector-fill TIMING bounded (§46): post-insert
      via the worker-connect message path (insert
      tails excluded, AddEvent core excluded),
      elements are the accept-nodes; the exact
      append site is unlocated (libumsg depth).
      hid-100 is CONDITIONAL (§46): guards + 4
      call sites sited, one message-driven;
      server-enable and active-tunnel negatives
      live; the enabling message is unlocated.
      MASTER sets (§44/§45): [27] ⊇ stubs with
      data (ppp servants; pppoe sub-modes; 26/27
      static registered, only hid 100
      conditional); [85] lacks 3 and [19] lacks
      8 (complements; cerm EXACT both versions).
      ipsec −2 = framework wildcard override
      (§45: late getLooper + addHandler).
      Residual: vector append site, ssld motive +
      liveness (VGA-gated), hid-100 enabling
      message.
  confidence: observed-only
  evidence:
    - source: code
      ref: "RouterOS 7.25 libumsg handler_info PR @0x7BB00 / HD @0x77EE0 full decode + alias-table negative census; see work/2026-10-chr-extraction/ws3c-prober-findings.md §38"
    - source: sample
      ref: "live CHR interrogation (registry batch, 7.25): pid sweep 0-433 + boot-race 38/38; see work/2026-10-chr-extraction/ws3c-prober-findings.md §38"
    - source: code
      ref: "RouterOS 7.25 loader shim-insertion rule (PR-order, 1024-arithmetic, suppression predicate, claimant negative census) + package table decode; see work/2026-10-chr-extraction/ws3c-prober-findings.md §41"
    - source: code
      ref: "RouterOS 7.25 loader route-insert mechanism (AddEvent allocator 0x8054286, boot phases, Peers callback, 0x400-site refutation, PR true-base re-decode); see work/2026-10-chr-extraction/ws3c-prober-findings.md §43"
    - source: code
      ref: "worker-shim unification (strstr mode selection, worker-branch stub registrations, spawn-loop pid-less posts, multiplepeer re-census); see work/2026-10-chr-extraction/ws3c-prober-findings.md §44"
    - source: sample
      ref: "live CHR interrogation (serial capture, zombie drain, v6 compat-block census, master handler sets, 7.25 + 6.49.23); see work/2026-10-chr-extraction/ws3c-prober-findings.md §44"
    - source: code
      ref: "spare/alias/REMOVE decode (novasock accepts, pid-1 tree-self, multiple-vector aliases, notice+REMOVE pairing, ssld exception); see work/2026-10-chr-extraction/ws3c-prober-findings.md §45"
    - source: sample
      ref: "live CHR interrogation (high-hid scans [27,101-106] + [85,100-101], [1031] probes, TLS attempts, 7.25); see work/2026-10-chr-extraction/ws3c-prober-findings.md §45"

