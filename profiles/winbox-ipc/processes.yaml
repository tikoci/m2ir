# RouterOS process / handler IDs — winbox-ipc
#
# The first u32 element of SYS_TO and SYS_FROM (key 0xFF0001/0xFF0002,
# tcode 0x88) is a process_id; subsequent elements are the handler
# hierarchy *within* that process. The same byte also forms the top byte
# of handler-private SYS_CMD values (e.g. 0x0A0065 -> process 0x0A,
# handler-local opcode 0x0065).
#
# Drained from Cisco-Talos `typeIDCode` (catch-all entries at lines
# 246-269 of Winbox_Dissector.lua, used as "if no full SYS/STD match,
# compare value & 0xFF0000"). Project-observed entries that don't appear
# in Cisco-Talos are recorded with confidence: observed-only.
---
m2ir-version: 0.1
schema-version: 0.1

profile: winbox-ipc
appears-in:
  - { field: 0xff0001, name: SYS_TO,   element-index: 0 }
  - { field: 0xff0002, name: SYS_FROM, element-index: 0 }
  - { field: 0xff0007, name: SYS_CMD,  byte: top-byte-of-u32 }

source-table:
  name: typeIDCode
  language: lua
  file: Winbox_Dissector.lua
  lines: { from: 246, to: 269 }
  repo: "Cisco-Talos/Winbox_Protocol_Dissector"
  url: "https://github.com/Cisco-Talos/Winbox_Protocol_Dissector/blob/master/Winbox_Dissector.lua#L246-L269"
  drained-on: 2026-05-03
  notes: |
    The catch-all section of `typeIDCode`. Each entry is a u32 of the
    form `0xPP0000`; the dissector matches `value & 0xFF0000` after the
    full SYS_*/STD_* lookup misses. The `0xPP` byte is the process id
    used in the first element of SYS_TO / SYS_FROM and as the top byte
    of handler-private SYS_CMD values.
  version-warning: |
    Process ids are assigned by `/nova/etc/loader/system.x3` and differ
    across RouterOS versions. Keep the Cisco-Talos table as a documented
    reference version, but do not treat its numeric process ids as a
    universal map.

evidence:
  - source: code
    ref: "Cisco-Talos Winbox_Dissector.lua:246-269 (typeIDCode process catch-alls)"
    url: "https://github.com/Cisco-Talos/Winbox_Protocol_Dissector/blob/master/Winbox_Dissector.lua#L246-L269"
  - source: code
    ref: "tenable/routeros msg_re/parse_x3 (system.x3 examples)"
    url: "https://github.com/tenable/routeros/blob/master/msg_re/parse_x3/README.md"
  - source: code
    ref: "tenable/routeros msg_re/find_handlers (registered handlers)"
    url: "https://github.com/tenable/routeros/blob/master/msg_re/find_handlers/README.md"
  - source: doc
    ref: "MarginResearch — Pulling MikroTik into the Limelight"
    url: "https://margin.re/2022/06/pulling-mikrotik-into-the-limelight/"
  - source: doc
    ref: "DEVCORE — Pwn2Own Toronto 2022"
    url: "https://devco.re/blog/2024/05/24/pwn2own-toronto-2022-a-9-year-old-bug-in-mikrotik-routeros-en/"
  - source: code
    ref: "private third-party WinBox client implementation (server-side monitoring product; source not publicly available) — see ./gui-handlers.yaml for the full handler catalog this sources"
  - source: code
    ref: "RouterOS 6.49.23 .x3 process map + 46-binary addHandler census; see work/2026-10-chr-extraction/README.md + net-bridge2-handler-tables.md §3"
  - source: sample
    ref: "live CHR interrogation (WS-3C prober hscan, 6.49.23 + 7.25); see work/2026-10-chr-extraction/ws3c-prober-findings.md §9"

version-observations:
  - version: "6.43.45"
    source: "/nova/etc/loader/system.x3 parsed by Tenable parse_x3"
    mappings:
      - { binary: /nova/bin/log, process-id: 0x03 }
      - { binary: /nova/bin/radius, process-id: 0x05 }
      - { binary: /nova/bin/moduler, process-id: 0x06 }
      - { binary: /nova/bin/user, process-id: 0x0d }
