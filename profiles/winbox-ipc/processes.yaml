  - date: 2026-07-14
    finding: |
      Added two new process ids (0x14 interface-family, 0x41 license) and
      one direct conflict (0x10: documented as `dude` by Cisco-Talos, but
      a private third-party implementation uses [16,2]/[16,13] for bridge
      port/vlan) from a private third-party WinBox client implementation.
      Also added a source-id-adoption note to 0x0d/[13,4] and a path-vs-
      command-code-top-byte discrepancy note to 0x4c/mepty. See
      ./gui-handlers.yaml for the full handler catalog this drains from.
  - date: 2026-10-31
    finding: |
      WS-4 drain of the 6.49.23 .x3 process map (91 entries) + static
      handler census (46 binaries) + live hscans both versions
      (ws3c-prober-findings.md §9): resolved 0x10 (bridge2, dude=103),
      0x4c (mepty process id), 0x78 (quickset), confirmed 0x14 (net)
      / 0x18 (sys2) / 0x2c (route) labels, added 0x3d (rbbios) /
      0x67 (dude) / 0x1f (radv), scoped 0x0a (mepty vs discover),
      recorded the v7 static-map deferral, the full handler census,
      and the [20,62]->[10,1] cross-process proxy.
