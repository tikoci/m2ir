    revision-history:
      - date: 2026-10-31
        belief: "0x10 identity conflict (dude vs bridge) unresolved"
        outcome: superseded
        evidence:
          - source: code
            ref: "RouterOS 6.49.23 .x3 map: 0x10 = bridge2, dude = 103; see work/2026-10-chr-extraction/README.md"
    open-questions:
      - "Which version range (if any) runs dude itself at 0x10, matching the Cisco-Talos label?"
  0x11: { canonical-name: console,  confidence: documented }
  0x12: { canonical-name: cerm,     confidence: documented }
  0x14:
    canonical-name: net
    confidence: observed-only
    notes: |
      Not in Cisco-Talos typeIDCode. The 6.49.23 loader map assigns 0x14
      to /nova/bin/net under the x3-name `interface` — confirming this
      file's descriptive `interface` label as the loader's own name. A
      private third-party implementation queries [20,0] (/interface),
