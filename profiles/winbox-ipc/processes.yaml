processes:
  0x01: { canonical-name: net,      confidence: documented }
  0x02:
    canonical-name: moduler
    confidence: documented
    notes: |
      Cisco-Talos labels 0x02 as `moduler` in its reference version. This
      slot is version-scoped: Tenable's CVE-2018-14847 PoC uses [2,2] as
      the `mproxy` file-transfer handler for RouterOS 6.30.1-6.42.x, while
      Tenable's parse_x3 sample for 6.43.45 moves `/nova/bin/moduler` to
      process id 0x06.
    version-identities:
      - version-source: "Cisco-Talos reference version"
        canonical-name: moduler
        confidence: documented
      - version-range: "6.30.1-6.42.x"
        canonical-name: mproxy
        confidence: documented
        evidence:
          - source: code
            ref: "tenable/routeros poc/bytheway (set_to(2,2))"
            url: "https://github.com/tenable/routeros/blob/master/poc/bytheway/src/main.cpp"
      - version: "6.49.23"
        canonical-name: mproxy
        confidence: observed-only
        evidence:
          - source: code
            ref: "RouterOS 6.49.23 .x3 process map; see work/2026-10-chr-extraction/README.md"
        notes: "Live hscan confirms [2,1]/[2,2] answer on both 6.49.23 and 7.25."
  0x03:
    canonical-name: sermgr
    confidence: documented
    notes: "Version-scoped: Tenable's 6.43.45 parse_x3 sample maps /nova/bin/log -> 0x03."
    version-identities:
      - version-source: "Cisco-Talos reference version"
        canonical-name: sermgr
        confidence: documented
      - version: "6.43.45"
        canonical-name: log
        confidence: documented
  0x04: { canonical-name: notify,   confidence: documented }
  0x05:
    canonical-name: radv
    confidence: documented
    notes: "Version-scoped: the 6.49.23 loader map assigns radv to 0x1f (31), not 0x05."
    version-identities:
      - version-source: "Cisco-Talos reference version"
        canonical-name: radv
        confidence: documented
      - version: "6.49.23"
        canonical-name: radv
        confidence: observed-only
        process-id: 0x1f
        evidence:
          - source: code
            ref: "RouterOS 6.49.23 .x3 process map; see work/2026-10-chr-extraction/README.md"
  0x06:
    canonical-name: system
    confidence: documented
    notes: "Version-scoped: Tenable's 6.43.45 parse_x3 sample maps /nova/bin/moduler -> 0x06."
    version-identities:
      - version-source: "Cisco-Talos reference version"
        canonical-name: system
        confidence: documented
      - version: "6.43.45"
        canonical-name: moduler
        confidence: documented
  0x1f:
    canonical-name: radv
    confidence: observed-only
    notes: "Not in Cisco-Talos typeIDCode (which places `radv` at 0x05). The 6.49.23 loader map assigns 31 (0x1f) to radv."
    evidence:
      - source: code
        ref: "RouterOS 6.49.23 .x3 process map; see work/2026-10-chr-extraction/README.md"
  0x07: { canonical-name: ping,     confidence: documented }
  0x08:
    canonical-name: undo
    confidence: documented
    notes: |
      Cisco-Talos labels 0x08 as `undo` in its reference version. Tenable's
      6.41.4 handler survey does not show a standalone `/nova/bin/undo`
      binary, so treat this as a version-specific identity rather than a
      universal guarantee of a dedicated undo daemon.
  0x09: { canonical-name: log,      confidence: documented }
  0x0a:
    canonical-name: mepty
    confidence: documented
    notes: |
      Cisco-Talos labels 0x0a as `mepty` (terminal PTY proxy; owns
      commands 0x0A0065 login / 0x0A0067 data per this project). CONFLICT:
      the 6.49.23 loader map assigns 0x0a to `discover`, with mepty at
      0x4c — while the mepty login/data SYS_CMD top byte stays 0x0a. So
      on v6 the PATH says discover but the COMMAND top byte says mepty;
      version-scoped like 0x02 and 0x0d.
    version-identities:
      - version-source: "Cisco-Talos reference version"
        canonical-name: mepty
        confidence: documented
      - version: "6.49.23"
        canonical-name: discover
        confidence: observed-only
        evidence:
          - source: code
            ref: "RouterOS 6.49.23 .x3 process map; see work/2026-10-chr-extraction/README.md"
        notes: "Live: discover answers {0,1,2} on v6, {0,1,2,3} on v7."
    open-questions:
      - "Why does the mepty command-code top byte (0x0a) match discover's v6 process id rather than mepty's own (0x4c)? Legacy assignment fossil, or shared dispatch?"
  0x0b: { canonical-name: pppman,   confidence: documented }
  0x0c: { canonical-name: radius,   confidence: documented }
  0x0d:
    canonical-name: hotplug
    confidence: documented
    notes: |
      Cisco-Talos labels 0x0D0000 as `hotplug` in its reference version.
      MarginResearch and Tenable's parse_x3 sample for RouterOS 6.43.45
      both place `/nova/bin/user` at process id 13 (0x0d), and
      MarginResearch's authentication trace uses [13,4] to reach the user
      authentication handler. Treat this numeric slot as version-scoped.
    version-identities:
      - version-source: "Cisco-Talos reference version"
        canonical-name: hotplug
        confidence: documented
      - version: "6.43.45"
        canonical-name: user
        confidence: documented
        notes: "MarginResearch's auth trace uses [13,4]; Tenable parse_x3 maps `/nova/bin/user` -> 13."
      - version: "6.49.23"
        canonical-name: user
        confidence: observed-only
        evidence:
          - source: code
            ref: "RouterOS 6.49.23 .x3 process map; see work/2026-10-chr-extraction/README.md"
        notes: "user = 13 stable since 6.43.45. Live: [13,1-8] map identical on 6.49.23 and 7.25 (4=auth legacy-CMD-only, 5=data, 6/7=FAILED)."
    revision-history:
      - date: 2026-05-03
        belief: "0x0D = user-service-or-similar (project observation [13,4]; loose attribution to MarginResearch)"
        outcome: superseded
        evidence:
          - source: doc
            ref: "winbox-m2-semantics.yaml processes.0x0d in strawman/"
      - date: 2026-05-03
        belief: "0x0D = hotplug; [13, 4] is hotplug subhandler 4"
        outcome: superseded
        evidence:
          - source: code
            ref: "Cisco-Talos Winbox_Dissector.lua:258 (HOTPLUG = 0X0d0000)"
            url: "https://github.com/Cisco-Talos/Winbox_Protocol_Dissector/blob/master/Winbox_Dissector.lua#L258"
      - date: 2026-05-04
        belief: "0x0D is version-scoped: hotplug in the Cisco-Talos reference version, user in 6.43.45's system.x3/auth traces"
        outcome: current
        evidence:
          - source: doc
            ref: "MarginResearch — [13,4] authentication path to user"
            url: "https://margin.re/2022/06/pulling-mikrotik-into-the-limelight/"
          - source: code
            ref: "tenable/routeros msg_re/parse_x3 — /nova/bin/user -> 13"
            url: "https://github.com/tenable/routeros/blob/master/msg_re/parse_x3/README.md"
    open-questions:
      - "Which RouterOS build produced Cisco-Talos's HOTPLUG = 0x0D label?"
      - "When did `/nova/bin/user` occupy process id 13, and what process id did hotplug move to in those builds?"
      - |
        A private third-party WinBox client implementation also sends a
        GET (cmdGet=7) to [13,4] once per connection, immediately after
        auth completes, purely to read back a server-assigned source id
        from the reply's SYS_FROM — see ./gui-handlers.yaml
        source-id-adoption. Is this the same `user` handler MarginResearch
        traces for authentication doing double duty as a capability
        exchange, or a distinct handler that happens to share the path?
  0x0e: { canonical-name: bridge,   confidence: documented }
  0x0f: { canonical-name: diskd,    confidence: documented }
  0x10:
    canonical-name: dude
    confidence: documented
    notes: |
      Version-scoped, RESOLVED for v6: Cisco-Talos labels 0x10 as `dude`
      in its reference version, but the 6.49.23 loader map assigns 0x10
      to `bridge2` with dude at 0x67 (103) — and the private
      implementation's [16,2]/[16,13] bridge port/vlan paths (see
      ./gui-handlers.yaml) corroborate bridge2 functionally. dude is a
      separate process here, not the bridge manager.
    evidence:
      - source: code
        ref: "private third-party WinBox client implementation (server-side monitoring product; source not publicly available)"
    version-identities:
      - version-source: "Cisco-Talos reference version"
        canonical-name: dude
        confidence: documented
      - version: "6.49.23"
