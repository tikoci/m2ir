      ref: "RouterOS libumsg.so base cmdGet/cmdSet/cmdGetAll/cmdUnknown = errorMsg(0xfe0003), missing obj-id = errorMsg(0xfe0004) (6.49.23); see work/2026-10-chr-extraction/net-bridge2-handler-tables.md §1"

