zero-value:
  role: "0 = success (the errorMsg()/return convention; SYS_ERRNO is only set on a reply when SYS_STATUS == ERROR)"
  confidence: inferred
  notes: "Inferred from the errorMsg errno convention (failure paths pass 0xFE0000-range codes, e.g. sys2 identity setter failure -> errorMsg(0xfe0006) = ERROR_FAILED); success is the zero value, never a 0xFE0000-range code."
  evidence:
    - source: code
      ref: "RouterOS sys2 identity setter 0x80719a8 failure path (6.49.23); see work/2026-10-chr-extraction/sys2-handler-tables.md"

base-handler-rules:
