# ── unpack= from TLVs 2–4 ────────────────────────────────────────────────
unpack-derivation:
  role: "How a receiver builds /ip/neighbor `unpack=` from the sender's TLVs 2–4 (TLV 14 plays no part)."
  confidence: observed-only
  versions-seen: ["7.26beta5"]
  rows:
    - { sender-unpacking: "no entry, disabled entry, or none", tlvs: [], neighbor-value: none }
    - { sender-unpacking: simple, tlvs: [2, 9], neighbor-value: simple }
    - { sender-unpacking: compress-headers, tlvs: [2, 3, 9], neighbor-value: uncompress-headers }
    - { sender-unpacking: compress-all, tlvs: [2, 3, 4, 9], neighbor-value: uncompress-all }
  notes: |
    Only the unpacking side is announced: packing=compress-all
    unpacking=none sends nothing. An entry on another interface does not
    change this interface's announcement. TLVs 2–4 and 9 follow TLV 1
    directly. The packed frames themselves (EtherType 0x9000) are a
    separate format, tracked in https://github.com/tikoci/m2ir/issues/3.
  evidence:
    - source: sample
      ref: "lab /ip/packing steps; see work/2026-11-mndp-grounding/evidence/probe-7.26beta5.json"

# ── requests ─────────────────────────────────────────────────────────────
requests:
  # A datagram that passes physical/mndp.yaml framing-rule is a request when
  # ANY of `any-of` holds. A request asks every router on the segment to
  # announce now. Malformed datagrams are not requests: no router answered
  # one (see framing-rule receiver-behavior). `tested-value-lengths` on a
  # clause lists the TLV value lengths for which that clause ALONE (with no
  # other clause true) was shown to draw replies.
  rule:
    requires: framing-rule
    any-of:
      - { header: 0x00000000 }
      - { has-tlv: 6, tested-value-lengths: [0], untested: "a non-empty TLV 6 with a non-zero header" }
  confidence: observed-only
  versions-seen: ["6.49.23", "7.17.2", "7.18.2", "7.20.8", "7.26beta5"]
  recommended:
    hex: "0000000000060000"
    why: |
      Draws a reply from every version tested without adding the requester to
      7.x routers' neighbor tables. A bare 00000000 also works, but 7.x
      receivers then list the requester (empty identity, its IPv4).
  # `requester-row`: whether the five 7.x receivers created or refreshed a
  # neighbor row for a sender they had never seen (requests-fresh.json):
  # created-or-refreshed, none, or not-checked. A row left from an earlier
  # datagram is not refreshed by one that creates none (fresh-z9-after-z4:
  # age 55 s). Whether 6.49.23 lists a requester was not checked.
  neighbor-row-rule: |
    On the five 7.x receivers, of the forms read in requests-fresh.json,
    00000000 and 01000000 created a row for a never-seen sender and
    0000000000060000 (empty TLV 6) did not. The three malformed forms read
    there (one byte after the last complete TLV) created none. Other forms,
    and 6.49.23, were not checked.
  forms:
    - { hex: "00000000", form: "header 0 (MAC-Telnet)", replies: true, requester-row: created-or-refreshed }
    - { hex: "0000000000000000", form: "header 0 + empty TLV 0", replies: true, requester-row: not-checked }
    - { hex: "0000000000060000", form: "header 0 + empty TLV 6", replies: true, requester-row: none }
    - { hex: "000000000006000100", form: "header 0 + TLV 6 with a value byte", replies: true, requester-row: not-checked }
    - { hex: "0100000000060000", form: "non-zero header + empty TLV 6", replies: true, requester-row: not-checked }
    - { hex: "0000000100060000", form: "non-zero header + empty TLV 6", replies: true, requester-row: not-checked }
    - { hex: "000000000000000000", form: "9 zero bytes (centrs mndpRefreshPacket)", replies: false, requester-row: none, notes: "trailing byte; 0 replies in 11 sends after run 1" }
    - { hex: "000000000006000000", form: "header 0 + TLV 6 + 1 byte (the 9-byte form)", replies: false, requester-row: none, notes: "trailing byte; 0 replies in 7 sends" }
    - { hex: "0000000000", form: "trailing byte", replies: false, requester-row: none }
    - { hex: "0000000000000000ffffff", form: "trailing bytes", replies: false, requester-row: not-checked }
    - { hex: "00000000000600000000000000", form: "trailing bytes", replies: false, requester-row: not-checked }
    - { hex: "010000000006000000", form: "trailing byte", replies: false, requester-row: not-checked }
    - { hex: "01000000", form: "non-zero header, no TLV 6", replies: false, requester-row: created-or-refreshed }
    - { hex: "00000001", form: "non-zero header, no TLV 6", replies: false, requester-row: not-checked }
    - { hex: "0100000000000000", form: "non-zero header, no TLV 6", replies: false, requester-row: not-checked }
    - { hex: "", form: "empty", replies: false, requester-row: not-checked }
    - { hex: "000000", form: "shorter than a header", replies: false, requester-row: not-checked }
    - { hex: "00000000000100060244444444440005000570726f6265", form: "announcement-shaped (TLVs 1, 5), header 0", replies: true, requester-row: not-checked, notes: "FINDINGS.md says it was listed as announced; no neighbor read for it is in the committed evidence" }
    - { hex: "00000000000100060244444444440005000570726f626500", form: "announcement-shaped, header 0, trailing byte", replies: false, requester-row: not-checked }
    - { hex: "05000000000100060244444444440005000570726f6265", form: "announcement-shaped (TLVs 1, 5), header 05000000", replies: false, requester-row: not-checked }
  replies:
    shape: "an ordinary announcement, same payload, advancing the header counter like any other"
    destination: "broadcast from port 5678 to 255.255.255.255:5678 and [ff02::1]:5678 (IPv4 only on 6.49.23 without the `ipv6` package), whatever the request's transport, source address or source port"
    unicast: "a unicast request draws a reply only from the router it is addressed to, and that reply is broadcast too"
    delay: "random per router: 11 ms to 1.96 s across all routers; 21 ms to 1.96 s on the 7.x routers (median about 1.1–1.3 s), 11 ms to 1.87 s on 6.49.23"
    bursts: "7.x routers merged two requests 200 ms apart, or five 50 ms apart, into one reply; 6.49.23 merged the five-request burst but once answered the 200 ms pair twice"
    confidence: observed-only
    open: "The delay's real bound was not measured; 11 ms to about 2 s fits every reply seen."
  evidence:
    - source: sample
      ref: "hub lab request forms, 3 shuffled rounds; see work/2026-11-mndp-grounding/evidence/requests-forms.json"
    - source: sample
      ref: "hub lab transports, ports and bursts; see work/2026-11-mndp-grounding/evidence/requests-main-run2.json"
    - source: sample
      ref: "requests from never-seen hosts and neighbor-table reads; see work/2026-11-mndp-grounding/evidence/requests-fresh.json"
  revision-history:
    - date: 2026-11-16
      belief: "a 9-byte request (nine zero bytes, or TLV 6 plus a pad byte) draws replies (centrs mndpRefreshPacket, the routeros-mndp skill)"
      outcome: superseded
      evidence:
        - source: sample
          ref: "0 replies in 11 and 7 sends; run 1's announcements after the 9-zero-byte send stay unexplained, likely already-scheduled announcements; see work/2026-11-mndp-grounding/FINDINGS.md → Requests"
  open: "WinBox's own request bytes were not captured, nor whether RoMON or the Dude send requests."

# ── TLV order by version ─────────────────────────────────────────────────
# Layouts describe the order senders were seen to use. They are not
# validation rules: a decoder should accept TLVs in any order, and no
# receiver was seen to depend on the order (not tested).
#
# `sampled` lists the versions a layout was captured on. `from`/`to` are
# advisory bounds, the lowest and highest sampled version (`to: null` =
# open-ended); any version other than a sampled one is extrapolation.
# `order` lists TLV types. An `optional` group's TLVs may each be left out
# but keep their relative order; `repeat: true` lets each appear more than
# once (TLV 15, one per IPv6 address). A `one-of` group is exactly one of
# its sequences, or none when `optional: true`; its `versions-seen` records
# the versions on which those sequences were observed (narrower than the
# layout's bounds), so outside those versions the group is extrapolation
# too. TLVs 15 and 17 are left out when the interface has no such address,
# including right after boot.
layouts:
  - kind: announcement
    from: "6.49.21"
    to: "7.19.4"
    sampled: ["6.49.21", "6.49.23", "7.6", "7.11beta6", "7.11", "7.12.1", "7.17.2", "7.18.2", "7.19.4"]
    order: [1, 5, 7, 8, 10, 11, 12, 14, { optional: [15], repeat: true }, 16, { optional: [17] }]
    confidence: observed-only
    notes: "6.49.23 sent no TLV 15, even with the `ipv6` package enabled."
    evidence:
      - source: sample
        ref: "lab, hub lab and field capture; see work/2026-11-mndp-grounding/FINDINGS.md → Layout by version"
  - kind: announcement
    from: "7.20"
    to: "7.23beta4"
    sampled: ["7.20", "7.20.8", "7.21.3", "7.23beta4"]
    order: [1, 5, 7, 8, 10, 11, 12, 14, { optional: [15], repeat: true }, 16, { optional: [17] }, 18]
    confidence: observed-only
    evidence:
      - source: sample
        ref: "hub lab 7.20.8 and field capture; see work/2026-11-mndp-grounding/FINDINGS.md → Layout by version"
  - kind: announcement
    from: "7.24beta1"
    to: "7.24beta1"
    sampled: ["7.24beta1"]
    order: [1, 5, 7, 8, 10, 11, 12, 14, 16, 18, { optional: [17] }]
    confidence: observed-only
    notes: "One packet from the centrs codec test fixture, not an m2ir capture. TLV 19 is not there yet."
    evidence:
      - source: sample
        ref: "centrs test/unit/mndp.test.ts captured RouterOS announcement"
        url: "https://github.com/tikoci/centrs/blob/0221b899da70b8c54410f357fd77c2133b286c08/test/unit/mndp.test.ts#L90"
  - kind: announcement
    from: "7.24.5"
    to: null
    sampled: ["7.24.5", "7.24.6", "7.25beta5", "7.25", "7.25.1", "7.26beta5"]
    order:
      - 1
      - { one-of: [[2, 9], [2, 3, 9], [2, 3, 4, 9]], optional: true, versions-seen: ["7.26beta5"] }
      - 5
      - 7
      - 8
      - 10
      - 11
      - 12
      - 14
      - 16
      - 18
      - 19
      - { optional: [17] }
      - { optional: [15], repeat: true }
    confidence: observed-only
    notes: "The one-of group is the /ip/packing TLVs (see `unpack-derivation`), seen on 7.26beta5 only."
    evidence:
      - source: sample
        ref: "lab sweep and probe, field capture; see work/2026-11-mndp-grounding/FINDINGS.md → Layout by version"
  - kind: dying-gasp
    from: "7.26beta5"
    to: null
    sampled: ["7.26beta5"]
    order: [1, 19, { optional: [17] }, { optional: [15], repeat: true }]
    confidence: observed-only
    notes: "TLV 19 is 00. The dying-gasp feature dates from 7.24 (changelog); this layout was captured on 7.26beta5 only."
    evidence:
      - source: sample
        ref: "see work/2026-11-mndp-grounding/evidence/dying-gasp-7.26beta5.json"

# ── timing and lifecycle ─────────────────────────────────────────────────
lifecycle:
  interval:
    rule: "periodic announcements follow /ip/neighbor/discovery-settings discover-interval"
    default: { before-7.16: 60s, from-7.16: 30s }
    minimum: "7.26beta5 rejects values under 5 s"
    confidence: observed-only
    evidence:
      - source: doc
        ref: "RouterOS changelog 7.16: default discover-interval 30 s"
      - source: sample
        ref: "field capture uptime ÷ counter ≈ 60 s on 6.49 and 7.6–7.12, and ≈ 30 s (the default) on most 7.19-and-later routers; a 7.23beta4 router showed ≈ 5 s and the 7.26beta5 RB1100Dx4 ≈ 10 s, set intervals; see work/2026-11-mndp-grounding/evidence/field-summary.json"
  triggered:
    sends-at-once: [identity, CAPsMAN, CMR, /ip/packing, IPv6 on/off, discovery protocol, lldp-med, mode, discover-interval, address changes]
    keeps-cadence: [MAC server, MAC WinBox, MAC ping, RoMON, bandwidth server, "IP services (winbox, api, ssh, telnet, ftp, api-ssl, www-ssl)", cloud DDNS, remote DNS, IP forwarding]
    confidence: observed-only
    versions-seen: ["7.26beta5"]
    notes: "Address changes come from the 7.21 changelog, not the lab."
    evidence:
      - source: sample
        ref: "lab probe steps; see work/2026-11-mndp-grounding/evidence/probe-7.26beta5.json"
  interval-shortening:
    rule: |
      Shortening discover-interval sends one triggered announcement but does
      not bring the next periodic one forward: after 2 h → 10 s, none of five
      routers sent a periodic announcement in the next 40 s. A receiver can go
      much longer than the new interval, and past the new TTL, without
      hearing from that router.
    confidence: inferred
    notes: "The mechanism (the pending periodic announcement is not rescheduled) is inferred; neither the old deadline firing nor the new cadence starting was observed."
    evidence:
      - source: sample
        ref: "hub lab; see work/2026-11-mndp-grounding/evidence/hub-session-2026-11-16.json → anchors"
  boot-announcement:
    rule: |
      The first announcement after boot has header 00000000, so it is also a
      request and neighbors answer it. It goes out 2–18 s into uptime and
      carries only the addresses the interface had by then, so TLVs 15 and 17
      are often missing; it was IPv4 only in 12 of 13 boots captured.
    confidence: observed-only
    versions-seen: ["6.49.23", "7.17.2", "7.18.2", "7.20.8", "7.26beta5"]
    evidence:
      - source: sample
        ref: "see work/2026-11-mndp-grounding/evidence/dying-gasp-7.26beta5.json and hub-session-2026-11-16.json"
  dying-gasp:
    rule: "with dying-gasp=yes (7.24+), a rebooting router sends a short announcement: header (the counter continues), then TLVs 1, 19 = 00, 17, 15"
    confidence: observed-only
    versions-seen: ["7.26beta5"]
    open: "The changelog says receivers clear the entry on it; the lab did not time that."
    evidence:
      - source: sample
        ref: "see work/2026-11-mndp-grounding/evidence/dying-gasp-7.26beta5.json"

