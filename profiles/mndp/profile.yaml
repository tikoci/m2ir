# mndp profile — MikroTik Neighbor Discovery Protocol (UDP/5678)
#
# Names the MNDP datagram grammar in physical/mndp.yaml: the header, each
# TLV type with its value encoding, byte order, allowed lengths, enum and
# bitmask values, plus request packets, layout by version, and timing.
# Every entry carries its confidence, the RouterOS versions it was seen
# on, and evidence.
#
# Promoted from work/2026-11-mndp-grounding/FINDINGS.md (2026-11-15/16).
# FINDINGS.md and its evidence/ files stay in work/ as the evidence; this
# file is canonical. Version strings are RouterOS versions as TLV 7 sends
# them, without the channel or build date.
---
m2ir-version: 0.1
schema-version: 0.1

id: mndp
title: MikroTik Neighbor Discovery Protocol (UDP/5678)
maturity: exploratory
description: |
  RouterOS announces itself on each discovery interface with an MNDP
  datagram, and lists what it hears in /ip/neighbor. WinBox and other
  tools use the same datagrams to find routers. MNDP is not an
  nv::message profile, but it carries the same values (identity, version,
  board, MAC, addresses, uptime) that turn up in the nv::message profiles.

physical-ref: ../../physical/mndp.yaml

# ── scope ────────────────────────────────────────────────────────────────
# `versions-seen: all` on an entry below means every version in
# `versions-observed`. Otherwise an entry lists the versions it was seen
# on. Absence from a list means "not seen", not "not sent". The test
# (test/profiles/mndp/) checks these lists against every evidence payload
# in both directions.
#
# Scope covers m2ir's own captures (lab, hub lab, field). The one external
# packet used here, a 7.24beta1 announcement in centrs's codec tests, backs
# only its own entry in `layouts` and is not counted in versions-observed
# or any versions-seen.
#
# Enum and bitmask tables are lists with a numeric `value` or `mask`, not
# maps keyed by hex, so a consumer never depends on how its YAML parser
# turns a 0x01 key into a string. Architectures use RouterOS
# architecture-name values.
scope:
  versions-observed:
    - "6.49.21"
    - "6.49.23"
    - "7.6"
    - "7.11beta6"
    - "7.11"
    - "7.12.1"
    - "7.17.2"
    - "7.18.2"
    - "7.19.4"
    - "7.20"
    - "7.20.8"
    - "7.21.3"
    - "7.23beta4"
    - "7.24.5"
    - "7.24.6"
    - "7.25beta5"
    - "7.25"
    - "7.25.1"
    - "7.26beta5"
  architectures-observed: [x86_64, arm, arm64, mipsbe]
  # Architectures backed by committed samples: x86_64 (lab CHRs), arm and
  # mipsbe (field summary rows). arm64 rests on FINDINGS.md's account of the
  # field capture; the committed summary records no arm64 row.
  architectures-in-committed-samples: [x86_64, arm, mipsbe]
  evidence-sets:
    lab:
      role: "quickchr CHRs 6.49.23, 7.24.6, 7.25 and 7.26beta5 on socket links, one setting changed per step, both routers' sniffers streamed to the host"
      ref: "work/2026-11-mndp-grounding/README.md → Method; evidence/sweep-baseline.json, probe-7.26beta5.json, ttl-7.26beta5.json, tlv19-7.26beta5.json, ageout*.json, dying-gasp-7.26beta5.json"
    hub-lab:
      role: "CHRs 6.49.23, 7.17.2, 7.18.2, 7.20.8 and two 7.26beta5 on one segment that the host joins as a station, so it can send requests and see every reply (2026-11-16)"
      ref: "work/2026-11-mndp-grounding/hub.ts; evidence/requests-*.json, running-7.26beta5.json, ipv6-7.17-7.26beta5.json, hub-session-2026-11-16.json"
    field:
      role: "35 s /tool/sniffer capture on a 7.26beta5 RB1100Dx4 whose neighbors run 6.49.21 and 7.6 to 7.26beta5 on ARM, ARM64 and MIPSBE; only a sanitized summary is committed"
      ref: "work/2026-11-mndp-grounding/evidence/field-summary.json"
    quickchr-cmr:
      role: "quickchr CMR wire study, 7.26beta5, 215 payloads"
      ref: "tikoci/quickchr examples/cmr/FINDINGS.md → Wire → MNDP"
      url: "https://github.com/tikoci/quickchr/blob/dd7e0ad99aa51acc79f086fe5d71e65efbb511eb/examples/cmr/FINDINGS.md#mndp"

evidence:
  - source: sample
    ref: "m2ir MNDP grounding (lab, hub lab, field capture); see work/2026-11-mndp-grounding/FINDINGS.md"
  - source: code
    ref: "Wireshark MNDP dissector (TLV names for types 1, 5, 7, 8, 10, 11, 12, 14, 15, 16, 17)"
    url: "https://github.com/wireshark/wireshark/blob/ffc784d8541ac6bfb038d2186195252603d1f602/epan/dissectors/packet-mndp.c"
  - source: code
    ref: "MAC-Telnet protocol.h (MT_MNDPTYPE_* for types 1, 5, 7, 8, 10, 11, 12, 16)"
    url: "https://github.com/haakonnessjoen/MAC-Telnet/blob/de620882c73e235ab319f3cb55481888d7d8f71d/src/protocol.h"
  - source: code
    ref: "tikoci/centrs MNDP codec at 0221b899"
    url: "https://github.com/tikoci/centrs/blob/0221b899da70b8c54410f357fd77c2133b286c08/src/data/mndp.ts"
  - source: doc
    ref: "MikroTik manual, Neighbor discovery (/ip/neighbor field names)"
    url: "https://manual.mikrotik.com/docs/system-information-and-utilities/neighbor-discovery/"
  - source: doc
    ref: "MikroTik manual, IP Packing (unpack= values)"
    url: "https://manual.mikrotik.com/docs/system-information-and-utilities/ip-packing/"

# ── transport ────────────────────────────────────────────────────────────
transport:
  port: 5678
  destinations:
    ipv4: "255.255.255.255:5678 (limited broadcast)"
    ipv6: "[ff02::1]:5678 (all-nodes multicast)"
  source-port: "5678 on announcements and replies; a request may come from any source port"
  confidence: observed-only
  versions-seen: ["6.49.23", "7.17.2", "7.18.2", "7.20.8", "7.24.6", "7.25", "7.26beta5"]
  notes: |
    Every announcement goes out as an IPv4 broadcast. Most also go out as an
    IPv6 ff02::1 copy with the same payload. On 7.x, every announcement that
    carried TLV 15 had an IPv6 copy. Without TLV 15 it was usually IPv4
    only, but not always: after boot with IPv6 enabled there were 0 to 2
    IPv4-only announcements before the first with TLV 15; while
    disable-ipv6=yes every announcement was IPv4 only; the first
    announcement after disable-ipv6=no varied (IPv4 only, an IPv6 copy
    without TLV 15, or both copies with TLV 15). 6.49.23 sends IPv4 only
    until the `ipv6` package is enabled. `mode=rx-only` stops both copies.
    A listener must bind port 5678: replies to requests are broadcast there
    too (see `requests.replies`).
  evidence:
    - source: sample
      ref: "lab + hub lab; see work/2026-11-mndp-grounding/FINDINGS.md → Timing and lifecycle → Transport"

# ── header ───────────────────────────────────────────────────────────────
header:
  fields:
    - name: announcement-counter
      offset: 0
      encoding: u32-sender-order
      confidence: observed-only
      versions-seen: all
      role: |
        Counts every announcement on that interface, periodic or triggered,
        and restarts at boot. The IPv4 and IPv6 copies of one announcement
        carry the same value. In the field capture, uptime ÷ counter ≈ the
        discover-interval for every device.
      byte-order-by-architecture:
        - architectures: [x86_64, arm, arm64]
          endian: le
          example: "20 7c 01 00 = 97,312 (7.26beta5 RB1100Dx4, 973,177 s uptime, 10 s interval)"
          notes: "x86_64 from the lab CHRs, arm from the field rows. arm64 is from FINDINGS.md; the committed field summary records no arm64 row."
        - architectures: [mipsbe]
          endian: be
          example: "00 00 23 58 = 9,048 (7.25beta5 RB912R, 271,468 s uptime, 30 s interval); 7.23beta4 RB924iR reads the same way"
      special-values:
        - value: 0x00000000
          name: request
          meaning: |
            A request, whatever follows, once the datagram passes
            physical/mndp.yaml framing-rule (a zero header with a trailing
            byte is malformed, not a request). A router's first announcement after
            boot has header 0, so neighbors answer it; the counter then
            continues from 1. See `requests` and `lifecycle.boot-announcement`.
          confidence: observed-only
          versions-seen: ["6.49.23", "7.17.2", "7.18.2", "7.20.8", "7.26beta5"]
          evidence:
            - source: sample
              ref: "hub lab: header-0 requests drew replies from all six routers; see work/2026-11-mndp-grounding/evidence/requests-forms.json"
            - source: sample
              ref: "boot announcements with header 0; see work/2026-11-mndp-grounding/evidence/hub-session-2026-11-16.json and dying-gasp-7.26beta5.json"
      notes: |
        A receiver reading the counter must guess the byte order, for example
        from the board or by comparing uptime ÷ counter with the expected
        interval under both readings. A short-uptime little-endian router
        moves only byte 0; a long-uptime big-endian router moves bytes 2–3.
      evidence:
        - source: sample
          ref: "field capture header bytes by CPU; see work/2026-11-mndp-grounding/evidence/field-summary.json"
        - source: sample
          ref: "boot announcements with header 0; see work/2026-11-mndp-grounding/evidence/dying-gasp-7.26beta5.json and hub-session-2026-11-16.json"
      revision-history:
        - date: 2026-11-15
          belief: "bytes 0–1 are version and TTL, bytes 2–3 a checksum (MAC-Telnet `struct mt_mndp_hdr`, sent as 0) or a big-endian sequence number (the routeros-mndp skill)"
          outcome: superseded
          evidence:
            - source: sample
              ref: "field capture: the moving bytes follow the CPU's byte order; see work/2026-11-mndp-grounding/FINDINGS.md → Header"
        - date: 2026-11-15
          belief: "only byte 0 changes (first quickchr CMR reading)"
          outcome: superseded
          evidence:
            - source: sample
              ref: "7.26beta5 RB1100Dx4 carried into byte 2 (20 7c 01 00); see work/2026-11-mndp-grounding/FINDINGS.md → Header"

# ── TLVs ─────────────────────────────────────────────────────────────────
# Keyed by TLV type. `name` is m2ir's identifier; `neighbor-field` is the
# /ip/neighbor field RouterOS 7.26beta5 prints for it (null when none).
# `length` is the value length a decoder accepts, in bytes, or `any`; when
# a sender should use one specific length that `length` does not pin down,
# `emit-length` gives it. `in` lists the kinds of datagram whose sender
# layout carries the TLV: announcement, request, dying-gasp. It describes
# what senders put in, not how a receiver classifies the datagram: a boot
# announcement (kind announcement, header 0) also satisfies the request
# rule. `versions-seen` lists sender versions, except where
# `versions-seen-of: receiver` says the versions are the routers that
# received and answered it (TLV 6, which only the lab station sent). `repeat`
# is true when one datagram can carry the TLV more than once. `since` is
# the first version seen sending it, when older versions did not;
# `introduced`, where given, is the release whose changelog adds it.
tlvs:
  1:
    name: mac-address
    neighbor-field: mac-address
    encoding: mac48
    length: 6
    in: [announcement, dying-gasp]
    confidence: documented
    versions-seen: all
    aka: { wireshark: MAC-Address, mac-telnet: MT_MNDPTYPE_ADDRESS }
    notes: |
      The sending interface's MAC. RouterOS receivers key the neighbor row on
      the frame's Ethernet source, not on this TLV: a spoofed announcement
      (Ethernet source 02:4d:4e:44:5c:01, TLV 1 02:66:66:66:66:66) was listed
      under the Ethernet source by 7.17.2 and 7.26beta5. A receiver on a UDP
      socket cannot see the Ethernet source, so TLV 1 is the best it has; on
      real routers the two match.
    evidence:
      - source: code
        ref: "Wireshark packet-mndp.c type 1 MAC-Address"
      - source: sample
        ref: "spoofed announcement, hub lab; see work/2026-11-mndp-grounding/evidence/hub-session-2026-11-16.json → anchors"
  2:
    name: unpack-simple
    neighbor-field: unpack
    encoding: empty
    length: 0
    in: [announcement]
    confidence: observed-only
    versions-seen: ["7.26beta5"]
    notes: |
      Sent when the interface's /ip/packing entry has unpacking=simple or
      higher; absent for no entry, a disabled entry, or unpacking=none.
      Always sent with TLV 9. See `unpack-derivation`.
    open: "Not seen on 6.x or on 7.x before 7.26beta5 (no field sender used packing)."
    evidence:
      - source: sample
        ref: "lab /ip/packing steps; see work/2026-11-mndp-grounding/evidence/probe-7.26beta5.json"
      - source: doc
        ref: "MikroTik IP Packing manual: routers announce their unpacking setting through neighbor discovery"
        url: "https://manual.mikrotik.com/docs/system-information-and-utilities/ip-packing/"
  3:
    name: unpack-headers
    neighbor-field: unpack
    encoding: empty
    length: 0
    in: [announcement]
    confidence: observed-only
    versions-seen: ["7.26beta5"]
    notes: "Added by unpacking=compress-headers and compress-all. See `unpack-derivation`."
    evidence:
      - source: sample
        ref: "lab /ip/packing steps; see work/2026-11-mndp-grounding/evidence/probe-7.26beta5.json"
  4:
    name: unpack-all
    neighbor-field: unpack
    encoding: empty
    length: 0
    in: [announcement]
    confidence: observed-only
    versions-seen: ["7.26beta5"]
    notes: "Added by unpacking=compress-all. See `unpack-derivation`."
    evidence:
      - source: sample
        ref: "lab /ip/packing steps; see work/2026-11-mndp-grounding/evidence/probe-7.26beta5.json"
  5:
    name: identity
    neighbor-field: identity
    encoding: text
    length: any
    in: [announcement]
    confidence: documented
    versions-seen: all
    aka: { wireshark: Identity, mac-telnet: MT_MNDPTYPE_IDENTITY }
    notes: "UTF-8 bytes as configured (ü is sent as c3 bc)."
    evidence:
      - source: code
        ref: "Wireshark packet-mndp.c type 5 Identity"
      - source: sample
        ref: "lab UTF-8 identity step; see work/2026-11-mndp-grounding/evidence/probe-7.26beta5.json"
  6:
    name: request
    neighbor-field: null
    encoding: bytes
    length: any
    emit-length: 0
    accepted-lengths-seen: [0, 1]
    in: [request]
    confidence: observed-only
    versions-seen-of: receiver
    versions-seen: ["6.49.23", "7.17.2", "7.18.2", "7.20.8", "7.26beta5"]
    notes: |
      "Send your announcement now". Never seen in an announcement. An EMPTY
      TLV 6 makes a well-formed datagram a request whatever the header: the
      non-zero-header probes (0100000000060000, 0000000100060000) drew
      replies. A 7.x receiver did not list the sender of 0000000000060000 as
      a neighbor. Send it empty (`emit-length: 0`). A 1-byte value was sent
      only with a zero header (000000000006000100), which is a request on its
      own, so that probe shows the datagram is accepted, not that a
      non-empty TLV 6 triggers a reply; a non-empty TLV 6 with a non-zero
      header was not tested. `accepted-lengths-seen` lists the lengths in
      datagrams that drew replies; `length: any` keeps decoding permissive.
      See `requests`.
    evidence:
      - source: sample
        ref: "hub lab request forms; see work/2026-11-mndp-grounding/evidence/requests-forms.json and requests-fresh.json"
  7:
    name: version
    neighbor-field: version
    encoding: text
    length: any
    in: [announcement]
    confidence: documented
    versions-seen: all
    aka: { wireshark: Version, mac-telnet: MT_MNDPTYPE_VERSION }
    formats:
      - versions: "6.x"
        example: "6.49.21 (long-term)"
        confidence: observed-only
      - versions: "7.6–7.13"
        example: "7.12.1 (stable) Nov/17/2023 11:38:45"
        confidence: observed-only
      - versions: "7.14–7.24"
        example: "7.24.6 (long-term) 2026-10-30 08:24:29"
        confidence: observed-only
        notes: "The 7.13/7.14 boundary comes from a neighbor table (7.13.5 and 7.14.3 neighbors), not a capture."
      - versions: "7.25 and later (7.25beta5 seen)"
        example: "7.25.1 2026-11-02 12:39:53"
        confidence: observed-only
        notes: "No channel. Pinned by the lab sweep: 7.24.6 sends the channel, 7.25 does not."
    evidence:
      - source: sample
        ref: "lab version sweep; see work/2026-11-mndp-grounding/evidence/sweep-baseline.json"
      - source: sample
        ref: "field capture TLV 7 by version; see work/2026-11-mndp-grounding/evidence/field-summary.json"
  8:
    name: platform
    neighbor-field: platform
    encoding: text
    length: any
    in: [announcement]
    confidence: documented
    versions-seen: all
    aka: { wireshark: Platform, mac-telnet: MT_MNDPTYPE_PLATFORM }
    notes: "`MikroTik`, or the branding package's value: a branded router in the field capture sent its branding name."
    evidence:
      - source: code
        ref: "Wireshark packet-mndp.c type 8 Platform"
      - source: sample
        ref: "field capture platformIsMikroTik; see work/2026-11-mndp-grounding/evidence/field-summary.json"
  9:
    name: aggregated-size
    neighbor-field: null
    encoding: bytes
    length: 4
    encoding-by-architecture:
      - architectures: [x86_64]
        encoding: u32le
        confidence: observed-only
        versions-seen: ["7.26beta5"]
        examples:
          - { hex: "dc050000", value: 1500 }
          - { hex: "e8030000", value: 1000 }
    in: [announcement]
    confidence: observed-only
    versions-seen: ["7.26beta5"]
    notes: |
      The /ip/packing aggregated-size, sent only with TLV 2. Little-endian on
      x86_64 (CHR): 1500 → dc 05 00 00, 1000 → e8 03 00 00; unverified on
      every other architecture, 32-bit x86 included. No /ip/neighbor
      field shows it. Decode it as u32le only for an x86_64 sender and keep
      the raw bytes otherwise; a receiver can only guess the sender's
      architecture, for example from TLV 12 board.
    open: "Byte order on big-endian CPUs is unverified: no field sender used packing."
    evidence:
      - source: sample
        ref: "lab aggregated-size steps; see work/2026-11-mndp-grounding/evidence/ageout-7.26beta5.json and probe-7.26beta5.json"
  10:
    name: uptime
    neighbor-field: uptime
    encoding: u32le
    length: 4
    in: [announcement]
    confidence: documented
    versions-seen: all
    aka: { wireshark: Uptime, mac-telnet: MT_MNDPTYPE_TIMESTAMP }
    notes: |
      Seconds since boot, little-endian on every CPU seen, MIPSBE included:
      the field MIPSBE rows match the neighbor table. This is the one integer
      whose byte order does not follow the sender's CPU.
    evidence:
      - source: code
        ref: "Wireshark packet-mndp.c type 10 Uptime"
      - source: code
        ref: "MAC-Telnet protocol.c parse_mndp converts uptime from little-endian"
        url: "https://github.com/haakonnessjoen/MAC-Telnet/blob/de620882c73e235ab319f3cb55481888d7d8f71d/src/protocol.c#L374"
      - source: sample
        ref: "field MIPSBE rows; see work/2026-11-mndp-grounding/evidence/field-summary.json"
  11:
    name: software-id
    neighbor-field: software-id
    encoding: text
    length: any
    in: [announcement]
    confidence: documented
    versions-seen: all
    aka: { wireshark: Software-ID, mac-telnet: MT_MNDPTYPE_SOFTID }
    notes: "The license software-id. Treat it as device-identifying when sharing captures."
    evidence:
      - source: code
        ref: "Wireshark packet-mndp.c type 11 Software-ID"
  12:
    name: board
    neighbor-field: board
    encoding: text
    length: any
    in: [announcement]
    confidence: documented
    versions-seen: all
    aka: { wireshark: Board, mac-telnet: MT_MNDPTYPE_HARDWARE }
    evidence:
      - source: code
        ref: "Wireshark packet-mndp.c type 12 Board"
  14:
    name: ipv6-enabled
    neighbor-field: ipv6
    encoding: u8
    length: 1
    in: [announcement]
    confidence: observed-only
    versions-seen: all
    aka: { wireshark: Unpack, centrs: unpack }
    values:
      - value: 0x00
        name: disabled
        neighbor-value: "false"
        notes: "The hub lab's REST reads of /ip/neighbor (7.26beta5 observer) left a false `ipv6` out instead of returning \"false\"; the field capture's neighbor table shows false."
        confidence: observed-only
        versions-seen: ["6.49.21", "6.49.23", "7.18.2", "7.20.8", "7.21.3", "7.23beta4", "7.26beta5"]
        evidence:
          - source: sample
            ref: "hub lab disable-ipv6 steps; see work/2026-11-mndp-grounding/evidence/ipv6-7.17-7.26beta5.json"
          - source: sample
            ref: "field capture: every 00 sender showed ipv6=false; see work/2026-11-mndp-grounding/evidence/field-summary.json"
      - value: 0x01
        name: enabled
        neighbor-value: "true"
        confidence: observed-only
        versions-seen: ["6.49.23", "7.6", "7.11beta6", "7.11", "7.12.1", "7.17.2", "7.18.2", "7.19.4", "7.20", "7.20.8", "7.24.5", "7.24.6", "7.25beta5", "7.25", "7.25.1", "7.26beta5"]
        evidence:
          - source: sample
            ref: "lab sweep and hub lab defaults; see work/2026-11-mndp-grounding/evidence/sweep-baseline.json and ipv6-7.17-7.26beta5.json"
    # What the flag follows, by sender version. `on-disable` / `on-enable`:
    # when the flag changes after the setting is turned off / on
    # (immediate, after-reboot, never, untested).
    meaning-by-version:
      - from: "6.0"
        to: "6.49.23"
        versions-tested: ["6.49.23"]
        follows: ipv6-package
        on-disable: untested
        on-enable: after-reboot
        notes: "00 while the `ipv6` package is disabled (its default), 01 once it is enabled; a package change takes effect at reboot."
        confidence: observed-only
        evidence:
          - source: sample
            ref: "hub lab, 6.49.23 with the ipv6 package; see work/2026-11-mndp-grounding/evidence/hub-session-2026-11-16.json → anchors"
      - from: "7.0"
        to: "7.17.2"
        versions-tested: ["7.17.2"]
        follows: none
        on-disable: never
        on-enable: never
        notes: "Means IPv6 present: stays 01 with disable-ipv6=yes, even after a reboot."
        confidence: observed-only
        evidence:
          - source: sample
            ref: "see work/2026-11-mndp-grounding/evidence/ipv6-7.17-7.26beta5.json (r717 steps)"
      - from: "7.18"
        to: "7.20.8"
        versions-tested: ["7.18.2", "7.20.8"]
        follows: disable-ipv6
        on-disable: after-reboot
        on-enable: immediate
        confidence: observed-only
        evidence:
          - source: sample
            ref: "see work/2026-11-mndp-grounding/evidence/ipv6-7.17-7.26beta5.json (r718, r720 steps)"
          - source: doc
            ref: "RouterOS changelog 7.18: advertise IPv6 capabilities based on the Disable IPv6 setting"
      - from: "7.21"
        to: "7.25.1"
        versions-tested: []
        follows: disable-ipv6
        on-disable: untested
        on-enable: untested
        notes: "Live setting changes were not tested on 7.21–7.25 (field rows show only the flag's value). The 7.21 changelog's \"fixed MNDP IPv6 status reporting\" is the likely start of immediate updates."
        confidence: guessed
        evidence:
          - source: doc
            ref: "RouterOS changelog 7.21: fixed MNDP IPv6 status reporting"
      - from: "7.26beta5"
        to: null
        versions-tested: ["7.26beta5"]
        follows: disable-ipv6
        on-disable: immediate
        on-enable: immediate
        confidence: observed-only
        evidence:
          - source: sample
